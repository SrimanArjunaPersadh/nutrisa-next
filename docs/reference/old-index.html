<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!-- Content-Security-Policy: restricts which origins can load code and where the page may
     send data. 'unsafe-inline' is required because the app uses inline <script>, inline
     onclick handlers, and inline styles throughout. connect-src is the real exfil defense:
     even compromised CDN code can only talk to Supabase + Open Food Facts, not an attacker host. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://REDACTED.supabase.co wss://REDACTED.supabase.co https://world.openfoodfacts.org https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>NutriSA — Nutrition & Weight Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" integrity="sha384-DhxhYObIMeMNGyAG7iK11OHzBIKyEIeRL0ad1iFPAOwZB8iirUlTT0O/WJJUk8+o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0F14;--bg2:#13161E;--bg3:#1A1E29;--bg4:#222736;--bg5:#2A3045;
  --border:#252A38;--border2:#2F3650;
  --blue:#0066FF;--blue2:#3385FF;--green:#22C55E;--red:#FF3B30;--amber:#F59E0B;
  --protein:#A78BFA;--carbs:#FCD34D;--fats:#2DD4BF;
  --text:#F1F5F9;--text2:#94A3B8;--text3:#4B5875;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;
  --r:14px;--rs:10px;

  /* FIX #3 — single source of truth for calorie targets */
  --kcal-min:2200;
  --kcal-target:2300;
  --kcal-max:2400;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:16px 16px 40px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.logo-main{font-family:var(--fh);font-size:26px;font-weight:800;font-style:italic;letter-spacing:1px;background:linear-gradient(135deg,#0066FF,#33A1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.logo-sub{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);letter-spacing:3px;text-transform:uppercase}
.nav-pills{display:flex;gap:3px;background:var(--bg3);border-radius:12px;padding:4px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:9px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .2s}
.pill:hover{color:var(--text2)}.pill.on{background:var(--blue);color:#fff;box-shadow:0 2px 12px #0066FF40}
.nwval{font-family:var(--fh);font-size:26px;font-weight:800;font-style:italic;text-align:right;line-height:1}
.nwlbl{font-size:13px;color:var(--text3);text-align:right}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.clbl{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.wci-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3)}
.wci-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.wci-lbl{font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);min-width:110px;flex-shrink:0}
.wci-val{font-family:var(--fh);font-size:14px;font-weight:800;font-style:italic}
.wci-badge{font-family:var(--fh);font-size:12px;font-weight:700;font-style:italic;margin-left:auto}
.wci-sep{height:1px;background:var(--border);margin:8px 0}
.wci-dense{padding:14px 16px}
.wci-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0}
.wci-col{display:flex;flex-direction:column;gap:3px}
.wci-big{font-family:var(--fh);font-size:26px;font-weight:800;font-style:italic;line-height:1.1}
.wci-sub{font-size:11px;color:var(--text3);margin-top:1px}
.wci-wow{font-size:12px;color:var(--text2);padding:6px 0}
.wci-adh{text-align:center;padding:8px 0 2px}
.wci-adh-num{font-family:var(--fh);font-size:36px;font-weight:800;font-style:italic;line-height:1.1}
.wci-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:10px 0}
.wci-cons{display:flex;flex-direction:column;gap:2px}
.wci-cons-v{font-family:var(--fh);font-size:17px;font-weight:800;font-style:italic;color:var(--text2);line-height:1.15}
@media(max-width:480px){.wci-row{flex-wrap:wrap}.wci-badge{margin-left:0}.wci-2col{grid-template-columns:1fr;gap:10px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;position:relative;overflow:hidden}
.tile::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.tb::after{background:linear-gradient(90deg,#0066FF,#33A1FF)}.tg::after{background:linear-gradient(90deg,#22C55E,#16A34A)}
.ta::after{background:linear-gradient(90deg,#F59E0B,#F97316)}.tr::after{background:linear-gradient(90deg,#FF3B30,#FF6B30)}
.tlbl{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.tval{font-family:var(--fh);font-size:28px;font-weight:800;font-style:italic;color:var(--text);line-height:1}
.tval.cb{color:var(--blue)}.tval.cg{color:var(--green)}.tval.cr{color:var(--red)}.tval.ca{color:var(--amber)}
.tunit{font-size:14px;font-style:normal;color:var(--text3)}.tsub{font-size:13px;color:var(--text3);margin-top:4px}
.mbar{margin-bottom:12px}.mbar:last-child{margin-bottom:0}
.mbhdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.mbname{font-family:var(--fh);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.mbnums{font-size:14px;color:var(--text2)}.mbnums b{color:var(--text);font-weight:800;font-size:15px}
.track{height:6px;background:var(--bg5);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
input,select{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fb);font-size:15px;padding:9px 12px;outline:none;transition:border .15s;width:100%}
input:focus,select:focus{border-color:var(--blue)}input::placeholder{color:var(--text3)}
.fl{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
.fr{display:grid;gap:8px;margin-bottom:10px}.fr2{grid-template-columns:1fr 1fr}
.btn{padding:9px 18px;border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .15s}
.bb{background:var(--blue);color:#fff}.bb:hover{background:var(--blue2)}.bsm{padding:6px 14px;font-size:13px}.bfw{width:100%}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:700;font-family:var(--fh);margin-left:4px}
.divl{height:1px;background:var(--border);margin:13px 0}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:15px;line-height:1.7}
.fx{display:flex;gap:8px;align-items:center}.sg{margin-bottom:12px}
.qarow{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:4px;transition:all .15s}
.qarow:hover{border-color:var(--blue);background:var(--bg4)}
.qaname{font-family:var(--fh);font-size:15px;font-weight:800;font-style:italic}.qasub{font-size:12px;color:var(--text3);margin-top:1px}
.qaplus{width:26px;height:26px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;flex-shrink:0}
.cathead{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin:10px 0 5px 1px}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}.wrow:last-child{border-bottom:none}
.wdate{font-size:14px;color:var(--text2)}.wtw{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--blue);margin-top:1px}
.wval2{font-family:var(--fh);font-size:20px;font-weight:800;font-style:italic}
.wd2{font-family:var(--fh);font-size:15px;font-weight:700}.dn{color:var(--green)}.up{color:var(--red)}
.delbtn{background:transparent;border:1px solid #FF3B3044;border-radius:6px;color:var(--red);cursor:pointer;font-size:12px;padding:3px 8px;margin-left:6px;transition:all .15s}
.delbtn:hover{border-color:var(--red);background:#FF3B3015}
.mitem{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.mitem:last-child{border-bottom:none}
.mname{font-weight:700;font-size:19px;font-family:var(--fh);font-style:italic}.mtime{font-size:12px;color:var(--text3);margin-top:1px}
.mkcal{font-family:var(--fh);font-size:15px;font-weight:700}.mmsub{font-size:11px;color:var(--text3);text-align:right;margin-top:1px}
.ttabs{display:flex;gap:3px;background:var(--bg3);border-radius:9px;padding:3px;width:fit-content}
.ttab{padding:5px 13px;border-radius:7px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fh);font-size:15px;font-weight:700;text-transform:uppercase;transition:all .15s}
.ttab.on{background:var(--bg5);color:var(--text);border:1px solid var(--border2)}
.lgnd{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text3)}.ld{width:12px;height:2px;border-radius:1px}
.goal-strip{background:linear-gradient(135deg,#0D1929,#0a1520);border:1px solid #0066FF22;border-radius:var(--r);padding:18px 22px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meal-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.meal-card:hover{border-color:var(--border2)}
.meal-card-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;transition:background .15s}
.meal-card-header:hover{background:var(--bg4)}
.meal-card-name{font-family:var(--fh);font-size:20px;font-weight:800;font-style:italic}
.mcm{font-size:14px;color:var(--text3)}.mcm.pro{color:var(--protein)}.mcm.carb{color:var(--carbs)}.mcm.fat{color:var(--fats)}
.addmeal-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-family:var(--fh);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.addmeal-btn:hover{background:var(--blue2)}.chevron{font-size:14px;color:var(--text3);transition:transform .2s;margin-left:8px;display:inline-block}
.meal-card-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}.meal-card-body.open{display:block}
.meal-note-strip{background:var(--bg4);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text3);margin:10px 0 8px;line-height:1.5}
/* FIX #5 — olive oil warning strip */
.oil-warning{background:#FF3B3018;border:1px solid #FF3B3044;border-radius:6px;padding:7px 10px;font-size:13px;color:var(--red);margin:10px 0 8px;line-height:1.5;font-weight:600}
.ing-table{width:100%;border-collapse:collapse;margin-top:4px}
.ing-table th{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:4px 0;border-bottom:1px solid var(--border);text-align:left}
.ing-table th:not(:first-child){text-align:right}
.ing-table td{padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}.ing-table tr:last-child td{border-bottom:none}
.ing-table td:not(:first-child){text-align:right;color:var(--text2)}.ing-name{font-weight:500;color:var(--text)}.ing-qty{font-size:12px;color:var(--text3);margin-top:1px}
.ing-total{background:var(--bg5);border-radius:6px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:8px;flex-wrap:wrap;gap:8px}
.ing-total-lbl{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.ing-total-nums{display:flex;gap:12px}.itn{font-size:14px;font-weight:600}
.ms-badge{display:inline-flex;align-items:center;gap:5px;background:#22C55E18;border:1px solid #22C55E44;border-radius:20px;padding:3px 10px 3px 7px;font-family:var(--fh);font-size:14px;font-weight:700;color:var(--green);margin-left:10px}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.search-result{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:5px;cursor:pointer;transition:all .15s}
.search-result:hover{border-color:var(--blue);background:var(--bg4)}
.sr-name{font-family:var(--fh);font-size:16px;font-weight:800;font-style:italic;color:var(--text)}
.sr-match{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.sr-macros{font-size:13px;color:var(--text3);margin-top:2px}
.no-res{text-align:center;padding:16px;color:var(--text3);font-size:14px}
.ing-editor{width:100%;border-collapse:collapse;margin-top:6px}
.ing-editor th{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:4px 0;border-bottom:1px solid var(--border);text-align:left}
.ing-editor th:not(:first-child){text-align:right}
.ing-editor td{padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.ing-editor tr:last-child td{border-bottom:none}
.ing-editor td:not(:first-child){text-align:right}
.gram-inp{width:62px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:14px;padding:5px 7px;text-align:right;outline:none;transition:border .15s;font-family:var(--fb)}
.gram-inp:focus{border-color:var(--blue)}
.im-cell{font-size:14px;color:var(--text2);min-width:36px;display:inline-block;text-align:right}
.live-tot{background:var(--bg5);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lt-lbl{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.lt-nums{display:flex;gap:12px}
.ltn2{font-size:15px;font-weight:700}
.meal-act{display:flex;gap:8px;margin-top:10px;justify-content:space-between;align-items:center}
.rst-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);font-family:var(--fh);font-size:14px;font-weight:700;padding:6px 12px;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.3px}
.rst-btn:hover{border-color:var(--text2);color:var(--text)}
.log-custom{background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:var(--fh);font-size:14px;font-weight:700;padding:7px 16px;cursor:pointer;transition:background .15s;text-transform:uppercase;letter-spacing:.5px}
.log-custom:hover{background:var(--blue2)}
.drag-meal{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:grab;margin-bottom:6px;transition:all .15s;user-select:none;gap:12px}
.drag-meal:hover{border-color:var(--blue);background:var(--bg4)}
.drag-meal.dragging{opacity:.35;cursor:grabbing;transform:scale(.98)}
.drag-meal-info{flex:1;min-width:0}
.drag-meal-actions{display:flex;align-items:center;flex-shrink:0}
.drag-meal .qaname{font-family:var(--fh);font-size:15px;font-weight:800;font-style:italic;color:var(--text);margin-bottom:3px}
.drag-meal .qasub{font-size:13px;color:var(--text3)}
#drop-zone{transition:border .2s,background .2s;min-height:180px}
#drop-zone.drag-over{border-color:var(--blue) !important;background:var(--bg3);box-shadow:inset 0 0 0 2px #0066ff33}
.logged-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);animation:slideIn .2s ease}
.logged-item:last-child{border-bottom:none}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes calNext{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes calPrev{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.cal-next{animation:calNext .2s ease-out both}
.cal-prev{animation:calPrev .2s ease-out both}
/* Water tracker */
.water-track{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.water-cup{width:32px;height:32px;border-radius:6px;border:2px solid var(--border2);background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.water-cup.filled{background:#0066FF22;border-color:var(--blue)}
.water-cup.seitan-req{border-color:var(--amber)}
/* Meal Builder */
.mb-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.mb-search-wrap{position:relative;margin-bottom:10px}
.mb-search-wrap input{padding-left:34px;font-size:13px}
.mb-results{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rs);z-index:100;max-height:220px;overflow-y:auto;margin-top:3px;box-shadow:0 8px 24px #00000060}
.mb-result{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.mb-result:last-child{border-bottom:none}
.mb-result:hover{background:var(--bg4)}
.mb-result-name{font-size:15px;font-weight:600;color:var(--text)}
.mb-result-cat{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.mb-result-macros{font-size:13px;color:var(--text3);text-align:right}
.mb-result-macros span{color:var(--text2)}
.mb-ing-row{display:grid;grid-template-columns:1fr 100px 52px 52px 52px 52px 32px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.mb-ing-row:last-child{border-bottom:none}
.mb-ing-name{font-size:14px;font-weight:600;color:var(--text)}
.mb-ing-cat{font-size:12px;color:var(--text3)}
.mb-ing-val{font-size:14px;color:var(--text2);text-align:right}
.mb-ing-val.pro{color:var(--protein)}
.mb-ing-val.carb{color:var(--carbs)}
.mb-ing-val.fat{color:var(--fats)}
/* FIX #5 — olive oil warning in builder */
.mb-ing-val.oil-warn{color:var(--red)}

<div class="app">

  </div>

<script>
/* ─── CONSTANTS ──────────────────────────────────────────────────────────────
   FIX #3: single source of truth for all calorie / macro targets.
   Every reference in the app derives from these. */
const GOAL = 88, RATET = 0.5 / 7;
const KCAL_MIN = 2200, KCAL_TARGET = 2300, KCAL_MAX = 2400;
const PRO_MIN = 175, PRO_TARGET = 175, PRO_MAX = 175;
const CARB_MIN = 180, CARB_MAX = 210;
const FAT_MIN = 55, FAT_MAX = 65;
const WATER_GOAL_NORMAL = 12;   // cups of 250ml = 3L
const WATER_GOAL_SEITAN = 14;   // cups of 250ml = 3.5L

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS = ['Breakfast','Lunch','Supper','Pre-Workout'];
/* Food-DB categories — used by the Add Custom Food form (Library tab).
   Mirrors the cat: values already present in FOOD_DB. */
const FOOD_CATS = ['Protein','Carb','Dairy','Vegetable','Fruit','Fat','Supplement','Legume','Condiment','Spice','Other'];

/* FIX #5 — foods that should trigger a warning when added */
const FLAGGED_FOODS = {
  'Olive Oil':    '⚠️ Olive oil is off-plan. Use cooking spray only.',
  'Coconut Oil':  '⚠️ Coconut oil is off-plan. Use cooking spray only.',
};

/* ─── HELPERS ─────────────────────────────────────────────────────────────── */
const LS = {
  get: k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return null; }},
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

/* Debounce utility — FIX #5 debounce on gram inputs */
function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

let S = {
  weights:[], meals:{}, custom:[], customFoods:[], view:'dashboard',
  mdate: td(), wtab:'all', wfrom:'', wto:'', wmonth:'', wpick:{from:'',to:'',viewMonth:''}, wpickOpen:false, dashView:{offset:0,range:30}, openCards:{}, gO:{},
  dpOpen:false, dpViewMonth:'', dpDir:'',
  wdDate: td(), wdOpen:false, wdViewMonth:'', wdDir:'',
  dashDate: td(), dashOpen:false, dashViewMonth:'', dashDir:'',
  sQ:'', lsQ:'',
  water:{},
  ql: { ings:[] },
  mb:{ ings:[], name:'', cat:'Breakfast', notes:'', ingSearch:'' },
  libCat:null  /* null = auto-select first category with meals; set on tab click */
};
let CH = {};
let _copyInFlight = false;

function td() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function now() { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fd(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function sW() { return [...S.weights].sort((a,b) => a.date.localeCompare(b.date)); }
function lw() { const s = sW(); return s.length ? s[s.length-1].w : 0; }
function startW() { const s = sW(); return s.length ? s[0].w : 0; }
function startDate() { const s = sW(); return s.length ? s[0].date.slice(5) : '--'; }
function lost() { const s = sW(); return s.length ? Math.max(0, s[0].w - lw()).toFixed(1) : '0.0'; }
function eachDayInRange(start, end) {
  const days = [], cur = new Date(start + 'T00:00:00');
  const last = new Date(end + 'T00:00:00');
  while (cur <= last) {
    const d = cur;
    days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}
function lastWeekBounds() {
  const today = new Date();
  const day = today.getDay() || 7;
  const lastSun = new Date(today);
  lastSun.setDate(today.getDate() - day);
  const lastMon = new Date(lastSun);
  lastMon.setDate(lastSun.getDate() - 6);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return { start: fmt(lastMon), end: fmt(lastSun) };
}
function dm() { return S.meals[S.mdate] || []; }
function tot(ms) {
  const r = ms.reduce((a,m) => ({kcal:a.kcal+m.kcal, pro:a.pro+m.pro, carb:a.carb+m.carb, fat:a.fat+m.fat}), {kcal:0,pro:0,carb:0,fat:0});
  return {kcal: Math.round(r.kcal), pro: +r.pro.toFixed(1), carb: +r.carb.toFixed(1), fat: +r.fat.toFixed(1)};
}
function pct(v, mx) { return Math.min(100, Math.round(v/mx*100)); }
function bc(v, mn, mx) { return v>mx?'var(--red)': v>=mn?'var(--green)':'var(--blue)'; }
function am() { return [...S.custom]; }
function vt(v) {
  if (!v) return '';
  const c = v==='A'?'#0066FF18;color:#0066FF': v==='B'?'#22C55E18;color:#22C55E':'#F59E0B18;color:#F59E0B';
  return `<span class="tag" style="background:${c}">${v}</span>`;
}

/* ─── TREND WEIGHT (α=0.1, MacroFactor algorithm) ────────────────────────── */
function tL(ws) {
  if (!ws.length) return [];
  const a = 0.1;
  const o = [{date: ws[0].date, tw: ws[0].w}];
  for (let i = 1; i < ws.length; i++)
    o.push({date: ws[i].date, tw: +(a * ws[i].w + (1-a) * o[i-1].tw).toFixed(2)});
  return o;
}

/* FIX #1 — weekly rate uses actual calendar dates, not array indices.
   Finds the trend weight from exactly 7 calendar days before the latest entry. */
function wr() {
  const s = sW();
  if (s.length < 2) return null;
  const t = tL(s);
  const last = t[t.length - 1];
  const cutoffMs = new Date(last.date).getTime() - 7 * 864e5;
  // Find the trend entry closest to (and not after) 7 days ago
  const ref = t.filter(x => new Date(x.date).getTime() <= cutoffMs).pop();
  if (!ref) return null;
  const days = (new Date(last.date).getTime() - new Date(ref.date).getTime()) / 864e5;
  if (days === 0) return null;
  return +((last.tw - ref.tw) / days * 7).toFixed(2);
}

/* FIX #2 — ETA uses trend weight, not raw daily reading.
   A samoosa spike no longer moves the projected goal date. */
function eta() {
  const s = sW();
  const trendArr = tL(s);
  const tw = trendArr.length ? trendArr[trendArr.length-1].tw : lw();
  if (tw <= GOAL) return 'Goal reached!';
  const d = new Date();
  d.setDate(d.getDate() + Math.round((tw - GOAL) / 0.5 * 7));
  return fd(d);
}

/* ─── WEEK FILTER ─────────────────────────────────────────────────────────── */
function fW() {
  const s = sW();
  if (S.wtab === 'week') {
    const d = new Date(); d.setDate(d.getDate() - 7);
    return s.filter(x => new Date(x.date) >= d);
  }
  if (S.wtab === 'month') {
    const now = new Date();
    const ym = S.wmonth || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const [yr, mo] = ym.split('-').map(Number);
    const first = new Date(yr, mo-1, 1);
    const last  = new Date(yr, mo, 0);
    return s.filter(x => new Date(x.date) >= first && new Date(x.date) <= last);
  }
  if (S.wtab === 'custom') {
    // Applied range takes priority
    if (S.wfrom || S.wto) {
      return s.filter(x => {
        if (S.wfrom && x.date < S.wfrom) return false;
        if (S.wto   && x.date > S.wto)   return false;
        return true;
      });
    }
    // No range set yet — auto-filter by the month currently shown in the picker
    if (S.wpick.viewMonth) {
      const [yr, mo] = S.wpick.viewMonth.split('-').map(Number);
      const first = `${yr}-${String(mo).padStart(2,'0')}-01`;
      const last  = `${yr}-${String(mo).padStart(2,'0')}-${String(new Date(yr,mo,0).getDate()).padStart(2,'0')}`;
      return s.filter(x => x.date >= first && x.date <= last);
    }
    return s;
  }
  return s;
}

/* FIX #6 — weekly averages grouped by actual ISO calendar week, not array chunks */
function weeklyAverages(entries) {
  if (!entries.length) return [];
  const map = {};
  entries.forEach(e => {
    const d = new Date(e.date);
    // ISO week: Monday-based
    const day = d.getDay() || 7;
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    const key = mon.toISOString().split('T')[0];
    if (!map[key]) map[key] = { lbl: key.slice(5), vals: [] };
    map[key].vals.push(e.w);
  });
  return Object.values(map).map(w => ({
    lbl: w.lbl,
    avg: (w.vals.reduce((a,b) => a+b, 0) / w.vals.length).toFixed(1),
    n: w.vals.length
  }));
}

/* ─── GRAM EDITOR (Library meal cards) ───────────────────────────────────── */
function getG(id, i) { const k = id+'_'+i; return S.gO[k] !== undefined ? S.gO[k] : null; }

/* FIX #3 (partial) — baseG now only parses the leading number from qty strings like
   "133g", "75g", "3g". parseFloat correctly extracts the number from these. */
function baseG(ing) { return parseFloat(ing.qty) || 100; }

function calcIng(id, ings) {
  return ings.map((ing, i) => {
    const bg = baseG(ing);
    const cg = getG(id, i) !== null ? getG(id, i) : bg;
    const r = bg > 0 ? cg / bg : 0;
    return {
      name: ing.name, g: cg,
      kcal: Math.round(ing.kcal * r),
      pro:  +(ing.pro  * r).toFixed(1),
      carb: +(ing.carb * r).toFixed(1),
      fat:  +(ing.fat  * r).toFixed(1)
    };
  });
}

function sumIngs(ings) {
  return ings.reduce((a,x) => ({
    kcal: a.kcal + x.kcal,
    pro:  +(a.pro  + x.pro ).toFixed(1),
    carb: +(a.carb + x.carb).toFixed(1),
    fat:  +(a.fat  + x.fat ).toFixed(1)
  }), {kcal:0,pro:0,carb:0,fat:0});
}


/* Custom meal gram editing — uses passed ingredient array instead of MD */
const _debouncedUpdateGCustom = debounce((id, i, val, ings) => {
  S.gO[id+'_'+i] = parseFloat(val) || 0;
  const calculated = calcIng(id, ings);
  calculated.forEach((ing, j) => {
    const setT = (sfx, v) => { const e = document.getElementById(`imc-${id}-${j}-${sfx}`); if(e) e.textContent = v; };
    setT('k', ing.kcal); setT('p', Math.round(ing.pro)+'g'); setT('c', Math.round(ing.carb)+'g'); setT('f', Math.round(ing.fat)+'g');
  });
  const t = sumIngs(calculated);
  const setT = (sfx, v) => { const e = document.getElementById(`itot-${id}-${sfx}`); if(e) e.textContent = v; };
  setT('k', t.kcal+' kcal'); setT('p', Math.round(t.pro)+'g P'); setT('c', Math.round(t.carb)+'g C'); setT('f', Math.round(t.fat)+'g F');
}, 300);

function updateGCustom(id, i, val, ings) { _debouncedUpdateGCustom(id, i, val, ings); }

function resetGCustom(id, ings) {
  ings.forEach((ing, i) => {
    delete S.gO[id+'_'+i];
    const el = document.getElementById('gi-'+id+'-'+i);
    if (el) el.value = baseG(ing);
  });
  const calculated = calcIng(id, ings);
  calculated.forEach((ing, j) => {
    const setT = (sfx, v) => { const e = document.getElementById(`imc-${id}-${j}-${sfx}`); if(e) e.textContent = v; };
    setT('k', ing.kcal); setT('p', Math.round(ing.pro)+'g'); setT('c', Math.round(ing.carb)+'g'); setT('f', Math.round(ing.fat)+'g');
  });
  const t = sumIngs(calculated);
  const setT = (sfx, v) => { const e = document.getElementById(`itot-${id}-${sfx}`); if(e) e.textContent = v; };
  setT('k', t.kcal+' kcal'); setT('p', Math.round(t.pro)+'g P'); setT('c', Math.round(t.carb)+'g C'); setT('f', Math.round(t.fat)+'g F');
}



function logCustomG(id) {
  const custom = S.custom.find(m => m.name === id);
  if (!custom || !custom.ingredients || !custom.ingredients.length) return;
  const baseIngs = custom.ingredients.map(ing => ({...ing, qty: String(parseFloat(ing.qty)||100)}));
  const ings = calcIng(id, baseIngs);
  const t = sumIngs(ings);
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  const meal = {name: custom.name, kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat, time: now(),
    _libId: custom.name,
    _ings: baseIngs.map((ing, i) => ({name:ing.name, qty:String(ings[i].g), kcal:ings[i].kcal, pro:ings[i].pro, carb:ings[i].carb, fat:ings[i].fat}))};
  const mealIdx = S.meals[S.mdate].length;
  S.meals[S.mdate].push(meal);
  LS.set('sc_m', S.meals);
  baseIngs.forEach((_,i) => delete S.gO[id+'_'+i]);
  render();
  cloudAddMeal(S.mdate, meal).then(cloudId => {
    if (cloudId && S.meals[S.mdate][mealIdx]) {
      S.meals[S.mdate][mealIdx]._id = cloudId;
      LS.set('sc_m', S.meals);
    }
  });
}

/* ─── SEARCH ──────────────────────────────────────────────────────────────── */
function doSearch(q) {
  const lower = (q||'').toLowerCase().trim();
  const el = document.getElementById('sr-n'); if (!el) return;
  if (lower.length < 2) { el.innerHTML = ''; return; }
  const hits = [];
  am().forEach(m => {
    let on = '';
    if (m.name.toLowerCase().includes(lower)) on = 'Meal name match';
    if (!on && m.ingredients && m.ingredients.length) {
      const fi = m.ingredients.find(x => x.name.toLowerCase().includes(lower));
      if (fi) on = fi.name;
    }
    if (on) hits.push({...m, on});
  });
  if (!hits.length) { el.innerHTML = `<div class="no-res">No meals found for "${q}"</div>`; return; }
  el.innerHTML = hits.map(m => `
    <div class="search-result">
      <div>
        <div class="sr-name">${m.name}${vt(m.v)}</div>
        <div class="sr-match">Contains: ${m.on}</div>
        <div class="sr-macros">${m.kcal}kcal · <span style="color:var(--protein)">${m.pro}g P</span> · ${m.carb}g C · ${m.fat}g F</div>
      </div>
      <button class="qaplus" onclick="qadd('${m.name}');document.getElementById('sr-n').innerHTML='';document.getElementById('si-n').value=''">+</button>
    </div>`).join('');
}

/* ─── DRAG & DROP ─────────────────────────────────────────────────────────── */
function dragStart(e, id) {
  S._dragId = id;
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => { const el = document.querySelector('[data-id="'+id+'"]'); if(el) el.classList.add('dragging'); }, 0);
}
function dragEnd() { document.querySelectorAll('.drag-meal').forEach(el => el.classList.remove('dragging')); S._dragId = null; }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect='copy'; const z=document.getElementById('drop-zone'); if(z) z.classList.add('drag-over'); }
function dragLeave(e) { const z=document.getElementById('drop-zone'); if(z&&!z.contains(e.relatedTarget)) z.classList.remove('drag-over'); }
async function dropMeal(e) {
  e.preventDefault();
  const z = document.getElementById('drop-zone'); if(z) z.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain') || S._dragId; if(!id) return;
  const m = am().find(x => x.name === id); if(!m) return;
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  const baseIngs = m.ingredients && m.ingredients.length
    ? m.ingredients.map(ing => ({...ing, qty: String(parseFloat(ing.qty)||100)}))
    : null;
  const meal = {
    name: m.name, kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
    time: now(), _libId: m.name,
    _ings: baseIngs ? baseIngs.map(ing => ({
      name: ing.name, qty: ing.qty,
      kcal: ing.kcal, pro: ing.pro, carb: ing.carb, fat: ing.fat
    })) : null
  };
  const mealIdx = S.meals[S.mdate].length;
  S.meals[S.mdate].push(meal);
  LS.set('sc_m', S.meals);
  render();
  const cloudId = await cloudAddMeal(S.mdate, meal);
  if (cloudId && S.meals[S.mdate][mealIdx]) {
    S.meals[S.mdate][mealIdx]._id = cloudId;
    LS.set('sc_m', S.meals);
  }
}

/* ─── FOOD DB HELPERS ─────────────────────────────────────────────────────── */
function isGramUnit(food) { return food.unit === 'g' || food.unit === 'ml'; }

function foodMacros(food, qty) {
  if (isGramUnit(food)) {
    const r = qty / 100;
    return {
      kcal: Math.round(food.per100.kcal * r),
      pro:  +(food.per100.pro  * r).toFixed(1),
      carb: +(food.per100.carb * r).toFixed(1),
      fat:  +(food.per100.fat  * r).toFixed(1),
    };
  } else {
    return {
      kcal: Math.round(food.perUnit.kcal * qty),
      pro:  +(food.perUnit.pro  * qty).toFixed(1),
      carb: +(food.perUnit.carb * qty).toFixed(1),
      fat:  +(food.perUnit.fat  * qty).toFixed(1),
    };
  }
}

function unitDisplayLabel(food, qty) {
  if (isGramUnit(food)) return food.unit;
  const base = food.unit;
  // Simple pluralisation for display
  const plurals = {slice:'slices',piece:'pieces',scoop:'scoops',steak:'steaks',spray:'sprays',tbsp:'tbsp',tsp:'tsp',pinch:'pinch'};
  return qty === 1 ? base : (plurals[base] || base);
}

function unitStep(food) {
  if (isGramUnit(food)) return food.unit === 'ml' ? 10 : 5;
  if (food.unit === 'tbsp' || food.unit === 'tsp') return 0.5;
  return 1;
}

function unitMin(food) { return 0; }

function searchFoodDB(q) {
  if (!q || q.trim().length < 1) return [];
  const lower = q.toLowerCase().trim();
  /* Built-in FOOD_DB + user's scanned/custom foods (sc_cf). Custom foods are
     stored in the same {name,cat,unit,defaultQty,per100|perUnit} shape, so they
     flow through foodMacros/mbAddIng identically. */
  const pool = [...FOOD_DB, ...(S.customFoods || [])];
  return pool.filter(f => f.name.toLowerCase().includes(lower)).slice(0, 8);
}

/* ─── MEAL BUILDER ────────────────────────────────────────────────────────── */
function mbCalcRow(ing) { return foodMacros(ing.f, ing.qty); }
function mbTotals() {
  return S.mb.ings.reduce((a, ing) => {
    const v = mbCalcRow(ing);
    return {kcal:a.kcal+v.kcal, pro:+(a.pro+v.pro).toFixed(1), carb:+(a.carb+v.carb).toFixed(1), fat:+(a.fat+v.fat).toFixed(1)};
  }, {kcal:0,pro:0,carb:0,fat:0});
}

/* Debounced live update for meal builder inputs — FIX #5 */

  S.mb.ings.forEach((ing, i) => {

    setTxt('mb-k-'+i, v.kcal); setTxt('mb-p-'+i, v.pro+'g'); setTxt('mb-c-'+i, v.carb+'g'); setTxt('mb-f-'+i, v.fat+'g');
  });
  const t = mbTotals();
  const setTxt = (id, val) => { const e = document.getElementById(id); if(e) e.textContent = val; };
  setTxt('mb-tot-k', t.kcal+' kcal'); setTxt('mb-tot-p', t.pro+'g P'); setTxt('mb-tot-c', t.carb+'g C'); setTxt('mb-tot-f', t.fat+'g F');
}, 300);

function mbUpdateLive() { _debouncedMbUpdate(); }

function mbAddIng(food) {
  /* FIX #5 — warn about olive oil / coconut oil when added to builder */
  if (FLAGGED_FOODS[food.name]) {
    const warn = document.getElementById('mb-oil-warn');
    if (warn) { warn.textContent = FLAGGED_FOODS[food.name]; warn.style.display='block'; }
  }
  const exists = S.mb.ings.find(i => i.f.name === food.name);
  if (exists) { exists.qty += food.defaultQty || 5; }
  else { S.mb.ings.push({f: food, qty: food.defaultQty || 100}); }

}

}

async function mbSave() {
  S.mb.ings.forEach((ing, i) => {
    const el = document.getElementById('mb-g-'+i);
    if(el) { const v=parseFloat(el.value); ing.qty = isNaN(v)||v<0 ? 0 : v; }
  });
  const nameEl=document.getElementById('mb-name'), catEl=document.getElementById('mb-cat'), notesEl=document.getElementById('mb-notes');
  const name = nameEl ? nameEl.value.trim() : '';
  const cat  = catEl  ? catEl.value : 'Breakfast';
  const notes= notesEl? notesEl.value.trim() : '';
  if (!name) { alert('Please enter a meal name'); nameEl&&nameEl.focus(); return; }
  if (S.mb.ings.length===0) { alert('Add at least one ingredient'); return; }
  const zeroIngs = S.mb.ings.filter(i=>i.qty===0);
  if (zeroIngs.length>0 && !confirm(zeroIngs.map(i=>i.f.name).join(', ')+' has 0g — continue?')) return;
  if (S.custom.find(m=>m.name.toLowerCase()===name.toLowerCase())) {
    if (!confirm(`A meal named "${name}" already exists. Overwrite?`)) return;
    S.custom = S.custom.filter(m=>m.name.toLowerCase()!==name.toLowerCase());
  }
  const t = mbTotals();
  const newMeal = {
    name, cat, note: notes||name,
    kcal:t.kcal, pro:t.pro, carb:t.carb, fat:t.fat,
    ingredients: S.mb.ings.map(ing => {
      const v = mbCalcRow(ing);
      return {name:ing.f.name, qty:ing.qty+'g', kcal:v.kcal, pro:v.pro, carb:v.carb, fat:v.fat};
    })
  };
  S.custom.push(newMeal);
  LS.set('sc_cu', S.custom);
  S.mb = {ings:[], name:'', cat:'Breakfast', notes:'', ingSearch:''};
  render();
  /* Persist to cloud */
  const cloudId = await cloudSaveCustomMeal(newMeal);
  if (cloudId) {
    const idx = S.custom.length - 1;
    S.custom[idx]._id = cloudId;
    LS.set('sc_cu', S.custom);
  }
}

/* ─── SERVING-SIZE VIEW (per-serving display over canonical per-100g storage) ──
   When OFF reports a serving, we SHOW the macros for one serving so they match the
   label, but we always STORE per-100g (cfSave converts back). cfServing remembers
   the serving size and which view is on screen. */
let cfServing = { grams: null, active: false };

/* Read a positive serving number from an OFF product, or null. serving_quantity is
   already a clean number (grams for solids, ml for drinks); if it's absent we try to
   pull "<number> g/ml" out of the free-text serving_size label. Commas → periods for
   SA decimals, same as the macro inputs. */
function parseServingGrams(p) {
  let x = p.serving_quantity;
  if (x != null) { x = parseFloat(String(x).replace(',', '.')); if (isFinite(x) && x > 0) return x; }
  const m = (p.serving_size || '').toLowerCase().replace(',', '.').match(/(\d+(?:\.\d+)?)\s*(?:g|ml)\b/);
  if (m) { const v = parseFloat(m[1]); if (isFinite(v) && v > 0) return v; }
  return null;
}

const CF_NUM_RE = /^-?\d*[.,]?\d+$/;
/* True (and alerts + focuses) if any macro/qty box holds non-numeric junk like
   "12abc" or "1.2.3". Shared by Save and the live serving-size rescale so
   parseFloat can't silently coerce malformed box values. A field is valid if it's
   blank or a clean number with one optional comma/period decimal; the optional
   leading "-" is allowed so cfSave's dedicated negative-value check still gives
   its specific message. */
/* Single source of truth for "is this text box a valid number?". Returns true
   (and alerts + focuses) when the box holds non-numeric junk. allowBlank lets the
   macro boxes treat empty as OK (blank = 0 elsewhere); for required fields like the
   weight box, pass allowBlank:false so an empty box is also rejected. */
function rejectBadNumber(id, lbl, allowBlank = true) {
  const raw = ((document.getElementById(id)||{}).value || '').trim();
  const ok = allowBlank ? (!raw || CF_NUM_RE.test(raw)) : (raw && CF_NUM_RE.test(raw));
  if (!ok) {
    alert(`${lbl} must be a number (e.g. 11 or 11,3) — "${raw}" isn't valid.`);
    document.getElementById(id)?.focus();
    return true;
  }
  return false;
}
function cfRejectBadNumber() {
  for (const [id, lbl] of [['cf-kcal','Calories'],['cf-pro','Protein'],['cf-carb','Carbs'],['cf-fat','Fat'],['cf-qty','Default Qty']]) {
    if (rejectBadNumber(id, lbl)) return true;
  }
  return false;
}

/* Read/write the four macro boxes as numbers. Display rounds to 1 decimal (the
   project rounds at display time, never in stored data). */
function _cfBoxes() {
  return ['cf-kcal','cf-pro','cf-carb','cf-fat']
    .map(id => parseFloat(((document.getElementById(id)||{}).value || '').replace(',', '.')));
}
function _cfSetBoxes(vals) {
  ['cf-kcal','cf-pro','cf-carb','cf-fat'].forEach((id, i) => {
    const e = document.getElementById(id); if (!e) return;
    e.value = (vals[i] == null || !isFinite(vals[i])) ? '' : String(Math.round(vals[i] * 10) / 10);
  });
}

/* Flip the on-screen boxes from per-100g to one serving: macros × X/100, Qty = X. */
function cfShowServing() {
  const X = cfServing.grams; if (!X) return;
  const u = (document.getElementById('cf-type')||{}).value === 'ml' ? 'ml' : 'g';
  _cfSetBoxes(_cfBoxes().map(v => v * X / 100));
  const qty = document.getElementById('cf-qty'); if (qty) qty.value = String(X);
  const hdr = document.getElementById('cf-macro-hdr'); if (hdr) hdr.textContent = `Macros per serving (${X} ${u})`;
  const lbl = document.getElementById('cf-qty-lbl'); if (lbl) lbl.textContent = `Default Qty (${u}) · 1 serving`;
  const tgl = document.getElementById('cf-serving-toggle'); if (tgl) { tgl.style.display = ''; tgl.textContent = `↔ per 100${u}`; }
  /* Offer to name the serving: if filled, Save stores a per-unit food so it logs by
     the unit (e.g. 1.5 biscuits) instead of grams. Blank = save in grams as before. */
  const uw = document.getElementById('cf-unit-wrap'); if (uw) uw.style.display = '';
  const ul = document.getElementById('cf-unit-lbl'); if (ul) ul.textContent = 'Log as (optional)';
  const ui = document.getElementById('cf-unit'); if (ui) ui.placeholder = 'biscuit, bar, slice…';
  cfServing.active = true;
}

/* Flip back to per-100g: macros × 100/X (only if we're currently on the serving
   view), Qty = 100. The toggle stays visible so you can switch back to the serving. */
function cfShowPer100() {
  const X = cfServing.grams;
  const u = (document.getElementById('cf-type')||{}).value === 'ml' ? 'ml' : 'g';
  if (cfServing.active && X) _cfSetBoxes(_cfBoxes().map(v => v * 100 / X));
  const qty = document.getElementById('cf-qty'); if (qty) qty.value = '100';
  const hdr = document.getElementById('cf-macro-hdr'); if (hdr) hdr.textContent = `Macros per 100 ${u}`;
  const lbl = document.getElementById('cf-qty-lbl'); if (lbl) lbl.textContent = `Default Qty (${u})`;
  const tgl = document.getElementById('cf-serving-toggle');
  if (tgl && X) { tgl.style.display = ''; tgl.textContent = `↔ per serving (${X} ${u})`; }
  const uw = document.getElementById('cf-unit-wrap'); if (uw) uw.style.display = 'none';
  cfServing.active = false;
}

function cfToggleServing() {
  if (cfRejectBadNumber()) return;   // don't rescale off a coerced junk box
  cfServing.active ? cfShowPer100() : cfShowServing();
}

/* User edited Default Qty while on the per-serving view → rescale the macros to the
   new amount and remember it as the serving size. Scaling boxes AND grams together
   keeps boxes/grams = per-100g/100, so Save still recovers the correct per-100g.
   In per-100g mode the qty is independent of the macros, so we leave them untouched. */
function cfQtyChange() {
  if (!cfServing.active || !cfServing.grams) return;
  if (cfRejectBadNumber()) return;   // don't rescale off a coerced junk box
  const el = document.getElementById('cf-qty');
  const newX = parseFloat(((el||{}).value || '').replace(',', '.'));
  if (!isFinite(newX) || newX <= 0) return;
  const oldX = cfServing.grams;
  if (newX === oldX) return;
  _cfSetBoxes(_cfBoxes().map(v => v * newX / oldX));
  cfServing.grams = newX;
  const u = (document.getElementById('cf-type')||{}).value === 'ml' ? 'ml' : 'g';
  const hdr = document.getElementById('cf-macro-hdr'); if (hdr) hdr.textContent = `Macros per serving (${newX} ${u})`;
}

/* Toggle unit-name field + macro/qty labels when switching measurement type.
   Per-unit foods must carry a non-gram unit so isGramUnit() stays false. */
function cfTypeChange() {
  /* Any manual type switch leaves the per-serving view; reset state + hide toggle.
     (cfLookup re-applies the serving view AFTER calling this.) */
  cfServing = { grams: null, active: false };
  const _tgl = document.getElementById('cf-serving-toggle'); if (_tgl) _tgl.style.display = 'none';
  const type = (document.getElementById('cf-type')||{}).value || 'g';
  const unitWrap = document.getElementById('cf-unit-wrap');
  const qtyLbl = document.getElementById('cf-qty-lbl');
  const macroHdr = document.getElementById('cf-macro-hdr');
  const qty = document.getElementById('cf-qty');
  if (type === 'unit') {
    if (unitWrap) unitWrap.style.display = '';
    /* Restore the manual per-unit labels (the serving view borrows this field). */
    const ul = document.getElementById('cf-unit-lbl'); if (ul) ul.textContent = 'Unit Name';
    const ui = document.getElementById('cf-unit'); if (ui) ui.placeholder = 'slice, scoop, piece';
    if (qtyLbl) qtyLbl.textContent = 'Default Qty (units)';
    if (macroHdr) macroHdr.textContent = 'Macros per unit';
    if (qty && (qty.value==='100'||qty.value==='')) qty.value = '1';
  } else {
    if (unitWrap) unitWrap.style.display = 'none';
    if (qtyLbl) qtyLbl.textContent = `Default Qty (${type})`;
    if (macroHdr) macroHdr.textContent = `Macros per 100 ${type}`;
    if (qty && (qty.value==='1'||qty.value==='')) qty.value = '100';
  }
}

function cfReset() {
  ['cf-name','cf-unit','cf-kcal','cf-pro','cf-carb','cf-fat','cf-barcode'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  const t=document.getElementById('cf-type'); if(t) t.value='g';
  const c=document.getElementById('cf-cat'); if(c) c.value='Protein';
  const q=document.getElementById('cf-qty'); if(q) q.value='100';
  cfTypeChange();
}

/* ─── BARCODE LOOKUP (Open Food Facts pre-fill) ───────────────────────────────
   Fills the Add-Custom-Food form from a barcode. Checks the user's own library
   first (instant, offline), then falls back to the free Open Food Facts API.
   Never auto-saves — it only pre-fills so Sriman can sanity-check the values,
   since crowd-sourced macros are sometimes wrong/missing and SA coverage is thin. */
async function cfLookup() {
  const setVal = (id, v) => { const e=document.getElementById(id); if(e) e.value = (v==null?'':v); };
  const status = msg => { const e=document.getElementById('cf-lookup-status'); if(e) e.textContent = msg; };

  const code = (document.getElementById('cf-barcode')?.value || '').trim();
  if (!code) { status('Type a barcode number first.'); return; }

  /* 1. Already in your library? Re-fill from the saved entry — no network needed. */
  const local = findCustomFoodByBarcode(code);
  if (local) {
    const m = isGramUnit(local) ? local.per100 : local.perUnit;
    setVal('cf-name', local.name);
    const cat = document.getElementById('cf-cat'); if (cat) cat.value = local.cat || 'Other';
    const type = document.getElementById('cf-type');
    if (type) { type.value = isGramUnit(local) ? local.unit : 'unit'; cfTypeChange(); }
    if (!isGramUnit(local)) setVal('cf-unit', local.unitLabel || local.unit);
    setVal('cf-qty', local.defaultQty);
    if (m) { setVal('cf-kcal', m.kcal); setVal('cf-pro', m.pro); setVal('cf-carb', m.carb); setVal('cf-fat', m.fat); }
    status(`✓ Found "${local.name}" in your library.`);
    return;
  }

  /* 2. Ask Open Food Facts. v2 product endpoint; `fields` keeps the response small. */
  status('Searching Open Food Facts…');
  try {
    /* Abort the request after 5s so a dead/slow connection can't hang the form.
       AbortController.signal lets us cancel fetch; clearTimeout cancels the timer
       if the response arrives first. Browsers forbid setting a custom User-Agent
       header from fetch (it's a "forbidden header"), so OFF sees the browser's UA. */
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,quantity,serving_size,serving_quantity`;
    let res;
    try { res = await fetch(url, {signal: ctrl.signal}); }
    finally { clearTimeout(timer); }
    const data = await res.json();
    if (data.status !== 1 || !data.product) {
      status("New product — add the macros once and it'll auto-fill instantly next time.");
      return;
    }
    const p = data.product, n = p.nutriments || {};

    /* Name: prefer "Brand Product", but skip the brand if the product name
       already contains it (avoids "Nutella Nutella"). Fall back to whatever exists. */
    const brand = (p.brands || '').split(',')[0].trim();
    const pname = (p.product_name || '').trim();
    const hasBrand = brand && pname.toLowerCase().includes(brand.toLowerCase());
    /* Strip angle brackets: OFF names come from a public wiki and later render via
       innerHTML in the food list, so a name like "<img onerror=...>" could run code.
       Neutralise at the source; manually-typed names are the user's own and untouched. */
    const name = ((hasBrand ? pname : [brand, pname].filter(Boolean).join(' ')) || `Barcode ${code}`).replace(/[<>]/g, '');
    setVal('cf-name', name);

    /* Pick g vs ml from the product's quantity string ("330 ml", "1,5 l" → ml).
       OFF labels drink nutriments "_100g" even when they're really per 100 ml,
       so the numbers stay correct — only the unit label changes. */
    const q = (p.quantity || '').toLowerCase();
    const isLiquid = /\b(ml|cl|dl|litre|liter|litres|liters)\b/.test(q) || /\d\s*l\b/.test(q);
    const type = document.getElementById('cf-type'); if (type) { type.value = isLiquid ? 'ml' : 'g'; cfTypeChange(); }

    /* Calories: kcal field if present, else convert the kJ "energy" value (kcal = kJ / 4.184). */
    let kcal = n['energy-kcal_100g'];
    if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;
    const round1 = v => (v == null ? null : Math.round(v * 10) / 10);
    setVal('cf-kcal', round1(kcal));
    setVal('cf-pro',  round1(n['proteins_100g']));
    setVal('cf-carb', round1(n['carbohydrates_100g']));
    setVal('cf-fat',  round1(n['fat_100g']));

    const missing = ['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g']
      .filter(k => k === 'energy-kcal_100g' ? kcal == null : n[k] == null).length;
    status(missing
      ? `Filled from Open Food Facts — ${missing} value(s) missing, please complete & check.`
      : '✓ Filled from Open Food Facts — please double-check, then Save Food.');

    /* Serving size: OFF gives serving_quantity (a clean number — grams for solids,
       ml for drinks) and serving_size (raw label text). If we can read a positive
       number, switch the form to a per-serving view: Default Qty = that number and
       the four macro boxes recalculated from per-100g down to one serving. The
       canonical per-100g values are restored at Save time, so storage stays correct. */
    const sg = parseServingGrams(p);
    cfServing.grams = sg; cfServing.active = false;
    if (sg) cfShowServing();
    else { const t = document.getElementById('cf-serving-toggle'); if (t) t.style.display = 'none'; }
  } catch (e) {
    console.error('Open Food Facts lookup failed:', e);
    status(e.name === 'AbortError'
      ? 'Lookup timed out after 5s — enter the macros manually.'
      : 'Lookup failed (offline or blocked) — enter the macros manually.');
  }
}

/* ─── LABEL-PHOTO OCR (vision pre-fill) ───────────────────────────────────────
   Accelerator on the manual-add path for when barcode/OFF miss (most SA goods).
   Snap the nutrition table → /api/ocr-label transcribes it → we pre-fill the SAME
   boxes cfLookup fills, then the user confirms/corrects and Saves. Never auto-saves,
   never blocks: any failure falls through to blank manual entry, exactly like the
   barcode scanner's every-exit rule.

   The model ONLY transcribes digits — every kJ→kcal conversion, per-serving→per-100g
   normalization, range guard and the Atwater sanity check happen here, deterministically.
   The photo is downscaled, sent once, and never stored anywhere. */
let cfPhotoBusy = false;

function cfPhotoStart() {
  if (cfPhotoBusy) return;
  const inp = document.getElementById('cf-photo-input');
  if (inp) { inp.value = ''; inp.click(); }   // reset so re-picking the same file refires onchange
}

/* Downscale to ≤1500px longest edge and re-encode as JPEG — keeps the upload small,
   the cost low, and well under Vercel's request body limit. Resolves {data, media_type}. */
function cfDownscaleImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 1500;
      let w = img.width, h = img.height;
      if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = (cv.toDataURL('image/jpeg', 0.8).split(',')[1]) || '';
      resolve({ data, media_type: 'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode_failed')); };
    img.src = url;
  });
}

async function cfPhotoFile(input) {
  const setVal = (id, v) => { const e=document.getElementById(id); if(e) e.value = (v==null?'':v); };
  const status = msg => { const e=document.getElementById('cf-lookup-status'); if(e) e.textContent = msg; };
  const file = input && input.files && input.files[0];
  if (!file || cfPhotoBusy) return;

  cfPhotoBusy = true;
  const btn = document.getElementById('cf-photo-btn'); if (btn) btn.disabled = true;
  status('Reading the label…');

  try {
    const { data, media_type } = await cfDownscaleImage(file);

    /* 30s ceiling so a slow connection can't hang the form — same guard style as cfLookup. */
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    let res;
    try {
      res = await fetch('/api/ocr-label', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ image_base64: data, media_type }),
        signal: ctrl.signal
      });
    } finally { clearTimeout(timer); }

    const out = await res.json().catch(() => ({ readable: false }));
    if (!res.ok || !out || out.readable !== true) {
      status("Couldn't read the label — enter the macros manually.");
      return;
    }

    /* ── All math is here, deterministic — the model only transcribed digits. ──
       kJ→kcal mirrors the OFF path (kcal = kJ / 4.184). */
    let kcal = null;
    if (Number.isFinite(out.energy_value)) {
      kcal = (out.energy_unit || '').toLowerCase() === 'kj' ? out.energy_value / 4.184 : out.energy_value;
    }

    /* Prefer the per-100g column. If only a per-serving column existed, normalize it
       (and the per-serving energy) up to per-100g using the printed serving size.
       Number.isFinite (not global isFinite) so a stray string can't coerce through. */
    let pro = out.protein_g, carb = out.carbs_g, fat = out.fat_g;
    const serving = (Number.isFinite(out.serving_g) && out.serving_g > 0) ? out.serving_g : null;
    if (out.per100_present === false && serving) {
      const scale = 100 / serving;
      const sc = v => Number.isFinite(v) ? v * scale : null;
      pro = sc(out.protein_g_per_serving); carb = sc(out.carbs_g_per_serving); fat = sc(out.fat_g_per_serving);
      if (kcal != null) kcal = kcal * scale;
    }

    /* Range guards: drop wild values rather than pre-fill nonsense. */
    const clamp = (v, hi) => (Number.isFinite(v) && v >= 0 && v <= hi) ? v : null;
    kcal = clamp(kcal, 902); pro = clamp(pro, 100); carb = clamp(carb, 100); fat = clamp(fat, 100);

    const round1 = v => (v == null ? null : Math.round(v * 10) / 10);
    /* Clean slate: per-100g g/ml view (clears any prior serving view), then fill. */
    const type = document.getElementById('cf-type'); if (type && type.value === 'unit') type.value = 'g';
    cfTypeChange();
    setVal('cf-kcal', round1(kcal));
    setVal('cf-pro',  round1(pro));
    setVal('cf-carb', round1(carb));
    setVal('cf-fat',  round1(fat));

    /* Quiet amber Atwater check — catches a likely bad read (e.g. a silent kJ/kcal mix-up).
       Only meaningful when all four are present; on a partial read it would cry wolf. */
    let warn = '';
    if (kcal != null && pro != null && carb != null && fat != null) {
      const est = 4 * pro + 4 * carb + 9 * fat;
      if (est > 0 && kcal > 0 && Math.abs(est - kcal) / kcal > 0.20) warn = ' ⚠ values look inconsistent — double-check kcal.';
    }

    const missing = [['kcal', kcal], ['protein', pro], ['carbs', carb], ['fat', fat]]
      .filter(([, v]) => v == null).map(([k]) => k);
    status((missing.length
      ? `Filled from photo — ${missing.join(', ')} unreadable, please complete & check.`
      : '✓ Filled from photo — please double-check, then Save Food.') + warn);

    /* If a per-100g label also printed a serving size, offer the per-serving view
       exactly like OFF does (canonical per-100g is restored at Save time). */
    if (serving && out.per100_present !== false) {
      cfServing.grams = serving; cfServing.active = false; cfShowServing();
    } else {
      const t = document.getElementById('cf-serving-toggle'); if (t) t.style.display = 'none';
    }
  } catch (e) {
    status(e && e.name === 'AbortError'
      ? 'Label read timed out — enter the macros manually.'
      : "Couldn't read the label — enter the macros manually.");
  } finally {
    cfPhotoBusy = false;
    const b = document.getElementById('cf-photo-btn'); if (b) b.disabled = false;
  }
}

/* ─── CAMERA BARCODE SCAN ─────────────────────────────────────────────────────
   Opens an inline viewfinder and reads a barcode, then hands the number to the
   existing cfLookup() exactly as if it were typed. Decoder strategy:
     1. Native BarcodeDetector  — built into Chrome/Edge (Android & desktop).
     2. @zxing/browser (CDN)    — fallback for iOS Safari, which has no native one.
   Hard rule: EVERY exit (cancel / denied / no camera / load failure / timeout /
   success) runs cfScanStop(), which kills the camera and hides the viewfinder.
   The manual input + Look-up button are never disabled, so typing is always open. */
const cfScan = { running:false, stream:null, detector:null, timer:0, deadline:0, zxControls:null };

async function cfScanStart() {
  if (cfScan.running) return;                       // guard against double-tap
  const sstatus = msg => { const e=document.getElementById('cf-scan-status'); if(e) e.textContent = msg || ''; };
  const wrap  = document.getElementById('cf-scan-wrap');
  const video = document.getElementById('cf-scan-video');
  if (!wrap || !video) return;

  /* getUserMedia needs a secure context (https or localhost). Bail cleanly if not. */
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cfScanStop('Camera needs HTTPS (or localhost) — type the barcode instead.');
    return;
  }

  cfScan.running = true;
  wrap.style.display = 'block';
  sstatus('Starting camera…');

  /* 1. Ask for the REAR camera. The browser shows its own permission prompt;
        a block/deny/no-camera all land here as an exception → clean exit. */
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (e) {
    cfScanStop(e && e.name === 'NotAllowedError'
      ? 'Camera blocked — allow access or type the barcode instead.'
      : 'No camera available — type the barcode instead.');
    return;
  }
  if (!cfScan.running) { stream.getTracks().forEach(t => t.stop()); return; } // cancelled mid-await
  cfScan.stream = stream;
  video.srcObject = stream;
  try { await video.play(); } catch (e) { /* some browsers autoplay anyway */ }

  /* Safety net: if nothing is read in 30s, stop and point back to manual entry. */
  cfScan.deadline = setTimeout(() => cfScanStop("Couldn't read a barcode — type it in instead."), 30000);

  /* 2. Prefer the browser's built-in reader when present. */
  if ('BarcodeDetector' in window) {
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      const want = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39'].filter(f => supported.includes(f));
      cfScan.detector = new BarcodeDetector(want.length ? { formats: want } : undefined);
      sstatus('Point the rear camera at a barcode…');
      cfScanLoopNative(video);
      return;
    } catch (e) { /* fall through to ZXing if the native reader won't construct */ }
  }

  /* 3. iOS Safari path: load ZXing from CDN and let it read frames. */
  cfScanZXing(video, sstatus);
}

/* Native loop: read one frame, retry on a gentle interval until a hit or exit.
   We re-check cfScan.running every tick so Cancel/timeout stops it immediately. */
async function cfScanLoopNative(video) {
  if (!cfScan.running || !cfScan.detector) return;
  try {
    const found = await cfScan.detector.detect(video);
    if (found && found.length) { cfScanHit(found[0].rawValue); return; }
  } catch (e) { /* transient per-frame errors are normal — just try again */ }
  if (cfScan.running) cfScan.timer = setTimeout(() => cfScanLoopNative(video), 200);
}

/* ZXing fallback: dynamic-import the ESM bundle from jsDelivr, then decode from
   the stream we already opened (so iOS does not prompt for the camera twice). */
async function cfScanZXing(video, sstatus) {
  let mod;
  try {
    mod = await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');
  } catch (e) {
    cfScanStop('Scanner failed to load (offline?) — type the barcode instead.');
    return;
  }
  if (!cfScan.running) return;                      // cancelled while downloading
  try {
    const reader = new mod.BrowserMultiFormatReader();
    sstatus('Point the rear camera at a barcode…');
    cfScan.zxControls = await reader.decodeFromStream(cfScan.stream, video, (result /*, err */) => {
      if (result && cfScan.running) cfScanHit(result.getText());
      /* a decode "error" fires on every frame without a barcode — that's normal, ignore it */
    });
  } catch (e) {
    cfScanStop('Camera scan failed — type the barcode instead.');
  }
}

/* A barcode was read: keep digits only, close the camera, fill the field, look up. */
function cfScanHit(raw) {
  const code = String(raw || '').replace(/\D/g, '');
  if (!code) return;                               // garbage read → keep scanning
  cfScanStop();
  const inp = document.getElementById('cf-barcode');
  if (inp) inp.value = code;
  cfLookup();
}

/* The single, always-safe exit. Stops every resource and collapses the viewfinder.
   Optional msg is shown in the normal lookup-status line so feedback survives the
   viewfinder closing. Calling it when nothing is running is harmless. */
function cfScanStop(msg) {
  cfScan.running = false;
  if (cfScan.timer)    { clearTimeout(cfScan.timer);    cfScan.timer = 0; }
  if (cfScan.deadline) { clearTimeout(cfScan.deadline); cfScan.deadline = 0; }
  if (cfScan.zxControls) { try { cfScan.zxControls.stop(); } catch (e) {} cfScan.zxControls = null; }
  if (cfScan.stream)   { cfScan.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); cfScan.stream = null; }
  cfScan.detector = null;
  const video = document.getElementById('cf-scan-video');
  if (video) { try { video.pause(); } catch (e) {} video.srcObject = null; }
  const wrap = document.getElementById('cf-scan-wrap'); if (wrap) wrap.style.display = 'none';
  const ss = document.getElementById('cf-scan-status'); if (ss) ss.textContent = '';
  if (msg) { const ls = document.getElementById('cf-lookup-status'); if (ls) ls.textContent = msg; }
}

async function cfSave() {
  const val = id => { const e=document.getElementById(id); return e ? e.value.trim() : ''; };
  /* Normalise SA comma-decimals before parsing: parseFloat("10,6") would stop at
     the comma and silently return 10, corrupting the value. Swap comma→period. */
  const num = id => { const v=parseFloat(val(id).replace(',', '.')); return isNaN(v) ? null : v; };

  const name = val('cf-name');
  if (!name) { alert('Please enter a food name'); document.getElementById('cf-name')?.focus(); return; }

  /* Reject malformed numeric input BEFORE parsing — shared with the live
     serving-size rescale (cfRejectBadNumber). type="text" lets the SA comma
     keypad through (the fix) but also lets junk like "12abc"/"1.2.3" through,
     which parseFloat would silently coerce; this rejects it up front. */
  if (cfRejectBadNumber()) return;

  const kcal = num('cf-kcal'), pro = num('cf-pro')??0, carb = num('cf-carb')??0, fat = num('cf-fat')??0;
  if (kcal == null) { alert('Calories are required'); document.getElementById('cf-kcal')?.focus(); return; }
  if (kcal < 0 || pro < 0 || carb < 0 || fat < 0) { alert('Macros cannot be negative'); return; }

  const type = val('cf-type') || 'g';
  const cat  = val('cf-cat') || 'Other';
  const barcode = val('cf-barcode');
  const macros = {kcal, pro, carb, fat};

  let food;
  if (type === 'unit') {
    /* Per-unit: GUARD against a gram unit (Step 1 Finding 3) — a per-unit food
       saved as unit:'g'/'ml' makes isGramUnit() true and foodMacros() reads the
       missing per100, crashing when the food is used. */
    let unit = val('cf-unit').toLowerCase();
    if (unit === 'g' || unit === 'ml') {
      alert(`"${unit}" is a weight/volume unit. For per-${unit} foods choose "100 ${unit}" above instead. For per-unit foods use a count unit like slice, scoop, or piece.`);
      document.getElementById('cf-unit')?.focus();
      return;
    }
    if (!unit) unit = 'unit';  // never let a per-unit food fall back to grams
    food = {name, cat, unit, unitLabel: unit, defaultQty: num('cf-qty') ?? 1, perUnit: macros, barcode: barcode || null};
  } else if (cfServing.active && cfServing.grams && val('cf-unit')) {
    /* Per-serving view + a named serving → save as a per-unit food so it logs by the
       unit (e.g. 1.5 biscuits) instead of grams. The boxes already show macros for one
       serving, so they ARE the per-unit macros; defaultQty starts at 1 unit, and the
       label keeps the gram weight for reference, e.g. "biscuit (40g)". */
    let unit = val('cf-unit').toLowerCase();
    if (unit === 'g' || unit === 'ml') {
      alert(`"${unit}" is a weight/volume unit, so it can't name a serving. Use a count name like biscuit, bar, or piece — or clear it to save in grams.`);
      document.getElementById('cf-unit')?.focus();
      return;
    }
    food = {name, cat, unit, unitLabel: `${unit} (${cfServing.grams}${type === 'ml' ? 'ml' : 'g'})`, defaultQty: 1, perUnit: macros, barcode: barcode || null};
  } else {
    /* Per-serving view shows macros for one serving, but we STORE per-100g so the
       food stays correct at any quantity. Divide the displayed values back out by the
       serving size; defaultQty (the qty box) keeps the serving so it defaults to 1
       serving when used. Round to 2 dp — enough precision, display rounds to whole. */
    let per100 = macros;
    if (cfServing.active && cfServing.grams) {
      const X = cfServing.grams, c = v => Math.round((v * 100 / X) * 100) / 100;
      per100 = {kcal: c(kcal), pro: c(pro), carb: c(carb), fat: c(fat)};
    }
    food = {name, cat, unit: type, defaultQty: num('cf-qty') ?? 100, per100, barcode: barcode || null};
  }

  /* Overwrite confirmation — mirror exactly what saveCustomFood() will do so the
     prompt can't lie. It dedupes by barcode first, else by name: a name-only
     match where this food carries a *different* barcode is saved as a SEPARATE
     entry, not an overwrite. */
  const lname = name.toLowerCase();
  const willReplace = (S.customFoods||[]).find(x =>
    (barcode && x.barcode && String(x.barcode) === barcode) ||
    (!barcode && x.name.toLowerCase() === lname));
  if (willReplace) {
    const how = (barcode && willReplace.barcode && String(willReplace.barcode) === barcode)
      ? `barcode ${barcode}` : `the name "${willReplace.name}"`;
    if (!confirm(`A custom food with ${how} already exists. Overwrite it?`)) return;
  } else {
    const sameName = (S.customFoods||[]).find(x => x.name.toLowerCase() === lname);
    if (sameName && !confirm(`Another food named "${name}" already exists (different barcode). Save this as a separate entry?`)) return;
  }

  const saved = await saveCustomFood(food);
  if (!saved) { alert('Could not save food — calories/macros may be missing.'); return; }
  cfReset();
  render();
}

async function cfDelete(i) {
  const f = (S.customFoods||[])[i];
  if (!f) return;
  if (!confirm(`Delete custom food "${f.name}"? It will no longer appear in ingredient search.`)) return;
  const removed = S.customFoods.splice(i, 1)[0];
  LS.set('sc_cf', S.customFoods);
  render();
  if (removed && removed._id) await cloudDelCustomFood(removed._id);
}

/* Pull all data from Supabase and merge into S, then render */
async function syncFromCloud() {
  if (!sb) { syncStatus('offline', 'Local only'); render(); return; }
  syncStatus('syncing', 'Syncing...');
  try {
    const [wRes, mRes, cRes, waRes, cfRes] = await Promise.all([
      sb.from('weight_logs').select('*').order('date', {ascending:true}),
      sb.from('meal_logs').select('*').order('date').order('sort_order'),
      sb.from('custom_meals').select('*').order('created_at'),
      sb.from('water_logs').select('*'),
      sb.from('custom_foods').select('*').order('created_at'),
    ]);

    if (wRes.error)  { console.error('weight_logs error:', wRes.error); throw wRes.error; }
    if (mRes.error)  { console.error('meal_logs error:', mRes.error); throw mRes.error; }
    if (cRes.error)  { console.error('custom_meals error:', cRes.error); throw cRes.error; }
    if (waRes.error) { console.error('water_logs error:', waRes.error); throw waRes.error; }
    if (cfRes.error) { console.error('custom_foods error:', cfRes.error); throw cfRes.error; }

    /* Weight logs → array of {date, w} */
    if (wRes.data.length > 0) {
      /* Strip time component — Supabase returns 'YYYY-MM-DDT00:00:00' for date columns */
      S.weights = wRes.data.map(r => ({date: r.date.slice(0,10), w: parseFloat(r.weight)}));
      LS.set('sc_w', S.weights);
    } else {
      /* No weights in Supabase yet — will populate when user logs first weight */
    }

    /* Meal logs → { 'YYYY-MM-DD': [{...}] } */
    if (mRes.data.length > 0) {
      const cloudMeals = {};
      mRes.data.forEach(r => {
        const date = r.date.slice(0,10);
        if (!cloudMeals[date]) cloudMeals[date] = [];
        cloudMeals[date].push({
          _id:    r.id,
          _libId: r.lib_id || null,
          _ings:  r.ings_json ? (() => { try { return JSON.parse(r.ings_json); } catch(e) { return null; } })() : null,
          name:   r.name,
          kcal:   Math.round(r.kcal),
          pro:    +parseFloat(r.pro).toFixed(1),
          carb:   +parseFloat(r.carb).toFixed(1),
          fat:    +parseFloat(r.fat).toFixed(1),
          time:   r.logged_time || '',
        });
      });
      /* Merge strategy: cloud is source of truth.
         Match by _id to patch _ings/_libId from local (race condition guard).
         Append any local entries with no _id or unknown _id (pending upload). */
      const localMeals = S.meals || {};
      const allDates = new Set([...Object.keys(cloudMeals), ...Object.keys(localMeals)]);
      const merged = {};
      allDates.forEach(date => {
        const cloud = cloudMeals[date] || [];
        const local = localMeals[date] || [];
        const cloudIds = new Set(cloud.map(cm => cm._id).filter(Boolean));
        const patched = cloud.map(cm => {
          const lm = local.find(l => l._id === cm._id);
          return {
            ...cm,
            _ings:  cm._ings  || (lm && lm._ings)  || null,
            _libId: cm._libId || (lm && lm._libId) || null,
          };
        });
        /* Local entries never successfully uploaded (no _id assigned yet) */
        const unsynced = local.filter(lm => !lm._id);
        merged[date] = [...patched, ...unsynced];
      });
      S.meals = merged;
      LS.set('sc_m', S.meals);
    }

    /* Custom meals */
    if (cRes.data.length > 0) {
      const cloudCustom = cRes.data.map(r => ({
        _id:         r.id,   // kept for cloud delete operations
        id:          r.id,   // also expose as id so (c.id||c.name) lookups work
        name:        r.name,
        cat:         r.cat,
        note:        r.note || '',
        kcal:        Math.round(r.kcal),
        pro:         +parseFloat(r.pro).toFixed(1),
        carb:        +parseFloat(r.carb).toFixed(1),
        fat:         +parseFloat(r.fat).toFixed(1),
        ingredients: r.ingredients || [],
      }));
      /* Preserve local meals never successfully uploaded (no _id), unless the
         cloud already has one with the same name (custom_meals upserts on name).
         Prevents losing a meal saved while offline / on a failed cloud write. */
      const cloudNames = new Set(cloudCustom.map(m => m.name.toLowerCase()));
      const unsynced = (S.custom || []).filter(m => !m._id && !cloudNames.has(m.name.toLowerCase()));
      S.custom = [...cloudCustom, ...unsynced];
      LS.set('sc_cu', S.custom);
    }

    /* Custom foods (scanned / manually-added ingredients) — cloud is source of
       truth. Stored in FOOD_DB shape so they merge into searchFoodDB(). */
    if (cfRes.data.length > 0) {
      const cloudFoods = cfRes.data.map(r => ({
        _id:        r.id,
        name:       r.name,
        cat:        r.cat,
        unit:       r.unit,
        defaultQty: r.default_qty != null ? parseFloat(r.default_qty) : (isGramUnit({unit:r.unit}) ? 100 : 1),
        ...(r.per100   ? {per100:   r.per100}   : {}),
        ...(r.per_unit ? {perUnit:  r.per_unit} : {}),
        ...(r.unit_label ? {unitLabel: r.unit_label} : {}),
        barcode:    r.barcode || null,
      }));
      /* Preserve local entries never successfully uploaded (no _id), unless the
         cloud already has the same food (match by barcode, else name). Mirrors
         the meal_logs unsynced-entry guard above. Prevents losing a food added
         while offline / on a failed cloud write. */
      const keyOf = f => (f.barcode ? 'b:'+f.barcode : 'n:'+f.name.toLowerCase());
      const cloudKeys = new Set(cloudFoods.map(keyOf));
      const unsynced = (S.customFoods || []).filter(f => !f._id && !cloudKeys.has(keyOf(f)));
      S.customFoods = [...cloudFoods, ...unsynced];
      LS.set('sc_cf', S.customFoods);
    }

    /* Water logs */
    if (waRes.data.length > 0) {
      const water = {};
      waRes.data.forEach(r => { water[r.date.slice(0,10)] = r.cups; });
      S.water = water;
      LS.set('sc_wa', S.water);
    }

    syncStatus('synced', 'Synced');
    render();
  } catch(e) {
    const msg = e?.message || e?.details || e?.hint || JSON.stringify(e) || 'Unknown error';
    console.error('Sync error details:', msg, e);
    syncStatus('error', 'Sync failed — using local data');
    render();
  }
}

async function copyYesterdayMeals() {
  if (_copyInFlight) return;
  _copyInFlight = true;
  const targetDate = S.mdate;
  try {
    const [y, mo, day] = targetDate.split('-').map(Number);
    const d = new Date(y, mo - 1, day - 1);
    const yest = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const src = S.meals[yest] || [];
    if (!src.length) { alert('No meals logged yesterday'); return; }
    if (!confirm(`Copy ${src.length} meal${src.length!==1?'s':''} from ${yest} into ${targetDate}?`)) return;
    if (!S.meals[targetDate]) S.meals[targetDate] = [];
    for (const m of src) {
      const c = {
        name: m.name, kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
        time: now(), _libId: m._libId || null,
        _ings: m._ings ? JSON.parse(JSON.stringify(m._ings)) : null,
      };
      S.meals[targetDate].push(c);
      LS.set('sc_m', S.meals);
      render();
      const cloudId = await cloudAddMeal(targetDate, c);
      if (cloudId) { c._id = cloudId; LS.set('sc_m', S.meals); }
    }
  } finally {
    _copyInFlight = false;
  }
}
