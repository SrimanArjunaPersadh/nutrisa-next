/* Look up a previously-saved custom food by its barcode for instant fill.
   Returns the food object or null. Local-only — no network. */
function findCustomFoodByBarcode(code) {
  if (!code) return null;
  const c = String(code).trim();
  return (S.customFoods || []).find(f => f.barcode && String(f.barcode) === c) || null;
}

/* Upsert a custom food to Supabase. Conflict target is `barcode` when present
   (re-scanning the same product updates the row), else `name`. Returns row id. */
async function cloudSaveCustomFood(food) {
  if (!sb) return null;
  syncStatus('syncing', 'Saving...');
  const row = {
    name: food.name, cat: food.cat || 'Other', unit: food.unit || 'g',
    default_qty: food.defaultQty != null ? food.defaultQty : (isGramUnit(food) ? 100 : 1),
    per100:    food.per100  || null,
    per_unit:  food.perUnit || null,
    unit_label: food.unitLabel || null,
    barcode:   food.barcode || null,
  };
  const onConflict = food.barcode ? 'barcode' : 'name';
  const {data, error} = await sb.from('custom_foods').upsert(row, {onConflict}).select().single();
  if (error) { console.error('custom_foods save error:', error); syncStatus('error', 'Save failed'); return null; }
  syncStatus('synced', 'Saved');
  return data.id;
}

/* Data-layer entry point: persist a custom food locally (immediate, offline-safe)
   then push to cloud. Dedupes by barcode, else by name. Returns the stored object.
   The scan / manual-add UI (later steps) calls this. */
async function saveCustomFood(food) {
  /* Normalise to FOOD_DB shape */
  const f = {
    name: (food.name || '').trim(),
    cat:  food.cat || 'Other',
    unit: food.unit || 'g',
    defaultQty: food.defaultQty != null ? food.defaultQty : (isGramUnit(food) ? 100 : 1),
    ...(food.per100  ? {per100:  food.per100}  : {}),
    ...(food.perUnit ? {perUnit: food.perUnit} : {}),
    ...(food.unitLabel ? {unitLabel: food.unitLabel} : {}),
    barcode: food.barcode ? String(food.barcode).trim() : null,
  };
  if (!f.name) { console.warn('saveCustomFood: name required'); return null; }
  if (!f.per100 && !f.perUnit) { console.warn('saveCustomFood: per100 or perUnit required'); return null; }
  /* Replace existing entry (match by barcode first, else name) */
  const idx = (S.customFoods || []).findIndex(x =>
    (f.barcode && x.barcode && String(x.barcode) === f.barcode) ||
    (!f.barcode && x.name.toLowerCase() === f.name.toLowerCase()));
  if (idx >= 0) { f._id = S.customFoods[idx]._id; S.customFoods[idx] = f; }
  else { S.customFoods.push(f); }
  LS.set('sc_cf', S.customFoods);
  const cloudId = await cloudSaveCustomFood(f);
  if (cloudId) { f._id = cloudId; LS.set('sc_cf', S.customFoods); }
  return f;
}

  if (!sb || !foodId) return true;

  const {error} = await sb.from('custom_foods').delete().eq('id', foodId);
  if (error) { syncStatus('error', 'Delete failed'); return false; }
  syncStatus('synced', 'Synced');
  return true;
}

/* ─── QUICK LOG ───────────────────────────────────────────────────────────── */
function qlSearch(q) {
  const dd = document.getElementById('ql-dd'); if (!dd) return;
  if (!q || q.trim().length < 1) { dd.innerHTML = ''; return; }
  const results = searchFoodDB(q);
  if (!results.length) {
    dd.innerHTML = `<div class="ql-result"><span style="color:var(--text3);font-size:12px">No ingredients found for "${q}"</span></div>`;
    return;
  }
  dd.innerHTML = results.map(f => {
    const m = isGramUnit(f) ? f.per100 : f.perUnit;
    const perLabel = isGramUnit(f) ? `per 100${f.unit}` : `per ${f.unitLabel || f.unit}`;
    const isOil = !!FLAGGED_FOODS[f.name];
    return `<div class="ql-result" onmousedown="event.preventDefault();qlAddIng(${JSON.stringify(f).replace(/"/g,'&quot;')})">
      <div>
        <div class="ql-result-name${isOil?' oil-warn':''}">${f.name}${isOil?' ⚠️':''}</div>
        <div class="ql-result-cat">${f.cat} · ${perLabel}</div>
      </div>
      <div class="ql-result-macros">
        <div>${m.kcal}kcal</div>
        <div><span style="color:var(--protein)">${m.pro}g P</span> · ${m.carb}g C · ${m.fat}g F</div>
      </div>
    </div>`;
  }).join('');
}

function qlAddIng(food) {
  const exists = S.ql.ings.find(i => i.f.name === food.name);
  if (exists) { exists.qty += food.defaultQty || 100; }
  else { S.ql.ings.push({ f: food, qty: food.defaultQty || 100 }); }
  const dd = document.getElementById('ql-dd'); if (dd) dd.innerHTML = '';
  const si = document.getElementById('ql-si'); if (si) { si.value = ''; si.focus(); }
  qlRenderRows();
}

function qlRemoveIng(i) {
  S.ql.ings.splice(i, 1);
  qlRenderRows();
}

function qlCalcRow(ing) { return foodMacros(ing.f, ing.qty); }

function qlTotals() {
  return S.ql.ings.reduce((a, ing) => {
    const v = qlCalcRow(ing);
    return { kcal: a.kcal+v.kcal, pro: +(a.pro+v.pro).toFixed(1), carb: +(a.carb+v.carb).toFixed(1), fat: +(a.fat+v.fat).toFixed(1) };
  }, {kcal:0, pro:0, carb:0, fat:0});
}

const _debouncedQlUpdate = debounce(() => {
  S.ql.ings.forEach((ing, i) => {
    const el = document.getElementById('ql-g-'+i);
    if (el) { const v = parseFloat(el.value); ing.qty = isNaN(v)||v<0 ? 0 : v; }
  });
  S.ql.ings.forEach((ing, i) => {
    const v = qlCalcRow(ing);
    const set = (id, val) => { const e = document.getElementById(id); if(e) e.textContent = val; };
    set('ql-k-'+i, v.kcal); set('ql-p-'+i, v.pro+'g'); set('ql-c-'+i, v.carb+'g'); set('ql-f-'+i, v.fat+'g');
  });
  const t = qlTotals();
  const set = (id, val) => { const e = document.getElementById(id); if(e) e.textContent = val; };

async function qlLogAll() {
  if (!S.ql.ings.length) return;
  // Sync quantities from inputs
  S.ql.ings.forEach((ing, i) => {
    const el = document.getElementById('ql-g-'+i);
    if (el) { const v = parseFloat(el.value); ing.qty = isNaN(v)||v<0 ? 0 : v; }
  });
  const t = qlTotals();
  // Build name: custom input or auto-generated from ingredients
  const nameEl = document.getElementById('ql-name');
  const customName = nameEl ? nameEl.value.trim() : '';
  const autoName = S.ql.ings.length === 1
    ? `${S.ql.ings[0].f.name} (${S.ql.ings[0].qty}${S.ql.ings[0].f.unit})`
    : S.ql.ings.map(i => `${i.f.name.split(' ')[0]} ${i.qty}${i.f.unit}`).join(', ');
  const name = customName || autoName;
  const meal = {
    name, kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat, time: now(),
    /* Store ingredients so the logged entry dropdown can show/edit them */
    _ings: S.ql.ings.map(i => ({
      name: i.f.name,
      qty:  String(i.qty),
      kcal: qlCalcRow(i).kcal,
      pro:  qlCalcRow(i).pro,
      carb: qlCalcRow(i).carb,
      fat:  qlCalcRow(i).fat,
    }))
  };
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  const mealIdx = S.meals[S.mdate].length; // lock index BEFORE push
  S.meals[S.mdate].push(meal);
  LS.set('sc_m', S.meals);
  S.ql.ings = [];
  render();
  // Save to cloud — _ings included via ings_json
  const cloudId = await cloudAddMeal(S.mdate, meal);
  if (cloudId && S.meals[S.mdate] && S.meals[S.mdate][mealIdx]) {
    S.meals[S.mdate][mealIdx]._id = cloudId;
    LS.set('sc_m', S.meals);
  }
}

/* ─── BOOT & ROUTING ──────────────────────────────────────────────────────── */
function boot() {
  document.addEventListener('click', e => {
    if (!e.target.closest('.mb-search-wrap')) { const dd=document.getElementById('mb-dd'); if(dd) dd.innerHTML=''; }
    if (!e.target.closest('.ql-search-wrap')) { const dd=document.getElementById('ql-dd'); if(dd) dd.innerHTML=''; }
    if (!e.target.closest('.la-search-wrap')) { document.querySelectorAll('[id^="la-dd-"]').forEach(dd => { dd.innerHTML=''; }); }
    if (!e.target.closest('#dp-wrap') && S.dpOpen) { S.dpOpen=false; render(); }
    if (!e.target.closest('#wd-wrap') && S.wdOpen) { S.wdOpen=false; render(); }
    if (!e.target.closest('#dash-wrap') && S.dashOpen) { S.dashOpen=false; render(); }
  });
  /* Load from localStorage immediately — app is usable before cloud responds */
  S.weights     = LS.get('sc_w') || [];
  S.meals       = LS.get('sc_m') || {};
  S.custom      = LS.get('sc_cu') || [];
  S.customFoods = LS.get('sc_cf') || [];
  S.water       = LS.get('sc_wa') || {};
  render();
  /* Sync from Supabase after render — don't block UI */
  if (sb) {
    setTimeout(syncFromCloud, 100);
  } else {
    syncStatus('offline', 'Local only');
  }
}

function go(v) {
  S.view = v;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p.textContent.toLowerCase().startsWith(v.slice(0,3))));
  render();
}

function render() {
  if (cfScan.running) cfScanStop(); // a re-render replaces the viewfinder DOM — release the camera first
  kc();
  const vc = document.getElementById('vc');
  if (S.view==='dashboard') vc.innerHTML = vD();
  else if (S.view==='nutrition') vc.innerHTML = vN();
  else if (S.view==='weight')    vc.innerHTML = vW();
  else if (S.view==='library')   vc.innerHTML = vLib();
  else if (S.view==='report')    vc.innerHTML = vWCI();
  document.getElementById('nw').textContent = lw().toFixed(1);
  setTimeout(ic, 80);
}

/* ─── WEEKLY CHECK-IN ────────────────────────────────────────────────────── */
function weeklyCheckIn() {
  const b = lastWeekBounds();
  const prevEnd = (() => {
    const d = new Date(b.start + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();

  const ws = sW();
  const w1Entries = ws.filter(x => x.date <= b.end);
  const w2Entries = ws.filter(x => x.date <= prevEnd);
  const w1Trend = w1Entries.length ? tL(w1Entries).at(-1).tw : null;
  const w2Trend = w2Entries.length ? tL(w2Entries).at(-1).tw : null;
  const trendDelta = (w1Trend !== null && w2Trend !== null) ? +(w1Trend - w2Trend).toFixed(2) : null;
  const noNewW = w1Trend !== null && ws.filter(x => x.date >= b.start && x.date <= b.end).length === 0;

  const rate = trendDelta;
  let rateLabel = 'No Data', rateColor = 'var(--text3)';
  if (rate !== null) {
    if (rate < -0.6)        { rateLabel = 'Ahead';    rateColor = 'var(--green)'; }
    else if (rate <= -0.4)  { rateLabel = 'On Track'; rateColor = 'var(--green)'; }
    else if (rate < 0)      { rateLabel = 'Behind';   rateColor = 'var(--amber)'; }
    else                    { rateLabel = 'Gaining';  rateColor = 'var(--red)';   }
  }

  const days = eachDayInRange(b.start, b.end);
  const loggedDays = days.filter(d => (S.meals[d]||[]).length > 0);
  const dailyTots = loggedDays.map(d => tot(S.meals[d]));
  const n = loggedDays.length;

  let avgPro = null, avgKcal = null, proHit = 0, kcalHit = 0;
  if (n > 0) {
    avgPro  = Math.round(dailyTots.reduce((a,t) => a + t.pro,  0) / n);
    avgKcal = Math.round(dailyTots.reduce((a,t) => a + t.kcal, 0) / n);
    proHit  = dailyTots.filter(t => t.pro  >= PRO_TARGET).length;
    kcalHit = dailyTots.filter(t => t.kcal >= KCAL_MIN && t.kcal <= KCAL_MAX).length;
  }
  const adherence = n > 0 ? Math.round((proHit + kcalHit) / (2 * n) * 100) : null;
  const adhColor = adherence === null ? 'var(--text3)'
                 : adherence >= 80   ? 'var(--green)'
                 : adherence >= 60   ? 'var(--amber)'
                 :                     'var(--red)';

  // ── Consistency metrics (raw data, no interpretation) ──
  const weighIns = days.filter(d => ws.some(x => x.date === d)).length;
  let lowPro = null, lowProDate = null;
  if (n > 0) {
    let mi = 0;
    dailyTots.forEach((t, i) => { if (t.pro < dailyTots[mi].pro) mi = i; });
    lowPro = Math.round(dailyTots[mi].pro);
    lowProDate = loggedDays[mi];
  }

  const prevStart = (() => {
    const d = new Date(b.start + 'T00:00:00'); d.setDate(d.getDate() - 7);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();
  const prevDays   = eachDayInRange(prevStart, prevEnd);
  const prevLogged = prevDays.filter(d => (S.meals[d]||[]).length > 0);
  const prevTots   = prevLogged.map(d => tot(S.meals[d]));
  const prevN      = prevLogged.length;
  const prevAvgPro  = prevN > 0 ? Math.round(prevTots.reduce((a,t) => a+t.pro,  0) / prevN) : null;
  const prevAvgKcal = prevN > 0 ? Math.round(prevTots.reduce((a,t) => a+t.kcal, 0) / prevN) : null;

  return { b, w1Trend, w2Trend, trendDelta, noNewW, rateLabel, rateColor,
           n, avgPro, avgKcal, proHit, kcalHit, adherence, adhColor,
           prevAvgPro, prevAvgKcal, prevN,
           weighIns, lowPro, lowProDate };
}

/* ─── WEEKLY CHECK-IN VIEW ───────────────────────────────────────────────── */
function vWCI() {
  const { b, w1Trend, trendDelta, noNewW, rateLabel, rateColor,
          n, avgPro, avgKcal, proHit, kcalHit, adherence, adhColor,
          prevAvgPro, prevAvgKcal, prevN,
          weighIns, lowPro, lowProDate } = weeklyCheckIn();

  const dayFmt = s => { const d = new Date(s+'T00:00:00'); return `${String(d.getDate()).padStart(2,'0')} ${MONTHS[d.getMonth()]}`; };
  const endD = new Date(b.end+'T00:00:00');
  const dateRange = `${dayFmt(b.start)} – ${dayFmt(b.end)} ${endD.getFullYear()}`;

  // Empty state: no meals and no weight data at all
  if (n === 0 && w1Trend === null) {
    const t = new Date(); const dow = t.getDay() || 7;
    const daysUntilSun = dow === 7 ? 7 : 7 - dow;
    const ns = new Date(t); ns.setDate(t.getDate() + daysUntilSun);
    const nss = `Sun, ${String(ns.getDate()).padStart(2,'0')} ${MONTHS[ns.getMonth()]}`;
    return `<div class="card wci-dense">
<div class="wci-hdr"><span>WEEKLY CHECK-IN</span><span>${dateRange}</span></div>
<div style="text-align:center;padding:28px 0 16px">
  <div style="font-size:28px;margin-bottom:14px">📋</div>
  <div style="font-family:var(--fh);font-size:17px;font-weight:700;color:var(--text2)">First report available after ${nss}</div>
  <div style="font-size:13px;color:var(--text3);margin-top:6px">Keep logging and check back Monday.</div>
</div></div>`;
  }

  // ── Section 1: Weight ──
  const twMain = w1Trend !== null ? `${w1Trend.toFixed(1)} kg` : '--';
  let twDelta = '', twDeltaCol = 'var(--text3)';
  if (trendDelta !== null && !noNewW) {
    twDeltaCol = trendDelta < 0 ? 'var(--green)' : 'var(--red)';
    twDelta = `${trendDelta < 0 ? '▼' : '▲'} ${Math.abs(trendDelta).toFixed(2)} kg`;
  } else if (noNewW) {
    twDelta = 'no new entries';
  }
  let rateVal = '--';
  let effRateLabel = rateLabel, effRateColor = rateColor;
  if (trendDelta !== null && !noNewW) {
    rateVal = `${Math.abs(trendDelta).toFixed(2)} kg/wk`;
  } else if (noNewW) {
    effRateLabel = 'No Data'; effRateColor = 'var(--text3)';
  }

  // ── Section 2: Nutrition ──
  const avgProStr  = n > 0 ? `avg ${avgPro}g`  : '--';
  const avgKcalStr = n > 0 ? `avg ${avgKcal}`  : '--';
  const proSub     = n > 0 ? `${proHit}/${n} days ≥ ${PRO_TARGET}g`         : 'no data';
  const kcalSub    = n > 0 ? `${kcalHit}/${n} days ${KCAL_MIN}–${KCAL_MAX}` : 'no data';

  // ── Section 3: Week-on-week (only if W-2 has data) ──
  let wowRow = '';
  if (n > 0 && prevN > 0) {
    const pd = avgPro - prevAvgPro;
    const kd = avgKcal - prevAvgKcal;
    const pSpan = pd >= 0
      ? `<span style="color:var(--green)">▲ +${pd}g</span>`
      : `<span style="color:var(--red)">▼ ${Math.abs(pd)}g</span>`;
    const kSpan = kd >= 0
      ? `<span style="color:var(--green)">▲ +${kd}</span>`
      : `<span style="color:var(--red)">▼ ${Math.abs(kd)}</span>`;
    wowRow = `<div class="wci-sep"></div>
<div class="wci-wow">vs prior week: Protein ${pSpan} &nbsp;·&nbsp; Calories ${kSpan}</div>`;
  }

  // ── Section 4: Consistency (raw context — days logged, weigh-ins, protein floor) ──
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const lowProDay = lowProDate ? DOW[new Date(lowProDate+'T00:00:00').getDay()] : '';
  const daysLoggedStr = `${n}/7`;
  const weighInStr    = `${weighIns}/7`;
  const lowProStr     = lowPro !== null ? `${lowPro}g${lowProDay ? ` (${lowProDay})` : ''}` : '--';
  const consRow = `<div class="wci-sep"></div>
<div class="wci-lbl" style="margin-bottom:4px">CONSISTENCY</div>
<div class="wci-3col">
  <div class="wci-cons"><div class="wci-cons-v">${daysLoggedStr}</div><div class="wci-sub">days logged</div></div>
  <div class="wci-cons"><div class="wci-cons-v">${weighInStr}</div><div class="wci-sub">weigh-ins</div></div>
  <div class="wci-cons"><div class="wci-cons-v">${lowProStr}</div><div class="wci-sub">low protein</div></div>
</div>`;

  // ── Section 5: Adherence ──
  const adhStr = adherence !== null ? `${adherence}%` : '--';
  const onTarget = proHit + kcalHit;
  const adhSub = n > 0 ? `${onTarget}/${2*n} days on target` : '';

  return `<div class="card wci-dense">
<div class="wci-hdr"><span>WEEKLY CHECK-IN</span><span>${dateRange}</span></div>
<div class="wci-2col">
  <div class="wci-col">
    <div class="wci-lbl">TREND</div>
    <div class="wci-big">${twMain}</div>
    <div class="wci-sub" style="color:${twDeltaCol}">${twDelta}</div>
  </div>
  <div class="wci-col">
    <div class="wci-lbl">RATE</div>
    <div class="wci-big" style="color:${effRateColor}">${rateVal}</div>
    <div class="wci-sub" style="color:${effRateColor};font-family:var(--fh);font-size:12px;font-weight:700;font-style:italic">${effRateLabel}</div>
  </div>
</div>
<div class="wci-sep"></div>
<div class="wci-2col">
  <div class="wci-col">
    <div class="wci-lbl">PROTEIN</div>
    <div class="wci-big">${avgProStr}</div>
    <div class="wci-sub">${proSub}</div>
  </div>
  <div class="wci-col">
    <div class="wci-lbl">CALORIES</div>
    <div class="wci-big">${avgKcalStr}</div>
    <div class="wci-sub">${kcalSub}</div>
  </div>
</div>${wowRow}
${consRow}
<div class="wci-sep"></div>
<div class="wci-adh">
  <div class="wci-lbl" style="margin-bottom:6px">ADHERENCE SCORE</div>
  <div class="wci-adh-num" style="color:${adhColor}">${adhStr}</div>
  ${adhSub ? `<div class="wci-sub" style="margin-top:4px">${adhSub}</div>` : ''}
</div>
</div>`;
}

/* ─── CALENDAR HELPERS ────────────────────────────────────────────────────── */
const CHEVL = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const CHEVR = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
const TRASH_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
const CAL_MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const CAL_WD = ['Mo','Tu','We','Th','Fr','Sa','Su'];
function calMonthOffset(ym, delta) {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function calBuildGrid(vy, vmn, todayStr, cellFn) {
  const dim  = new Date(vy, vmn, 0).getDate();
  const sdow = (new Date(vy, vmn-1, 1).getDay()+6) % 7;
  let cells  = Array(sdow).fill('<div class="dp-cell"></div>').join('');
  for (let d = 1; d <= dim; d++) {
    const date = `${vy}-${String(vmn).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells += cellFn(d, date, date === todayStr);
  }
  return cells;
}

/* ─── DATE PICKER (single-select, reusable) ──────────────────────────────── */
function renderDatePicker(date, cfg) {
  const c = Object.assign({
    dateExpr:'S.mdate', openKey:'dpOpen', vmKey:'dpViewMonth', dirKey:'dpDir', wrapId:'dp-wrap'
  }, cfg || {});
  const todayStr = td();
  const vm  = S[c.vmKey] || date.slice(0,7);
  const [vy, vmn] = vm.split('-').map(Number);
  const pMo = calMonthOffset(vm, -1), nMo = calMonthOffset(vm, 1);
  const animClass = S[c.dirKey]==='next'?'cal-next':S[c.dirKey]==='prev'?'cal-prev':'';
  S[c.dirKey] = '';
  const cells = calBuildGrid(vy, vmn, todayStr, (d, dt, isToday) => {
    const cls = ['dp-day', dt===date?'sel':'', isToday?'today':''].filter(Boolean).join(' ');
    return `<div class="dp-cell"><button class="${cls}" onclick="event.stopPropagation();${c.dateExpr}='${dt}';S.${c.openKey}=false;render()">${d}</button></div>`;
  });
  const dObj = new Date(date+'T00:00:00');
  const dispDate = dObj.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  return `
<div class="dp-wrap" id="${c.wrapId}">
  <button class="dp-btn${S[c.openKey]?' open':''}" onclick="S.${c.openKey}=!S.${c.openKey};S.${c.vmKey}=S.${c.openKey}?'${date.slice(0,7)}':'';render()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    ${dispDate}
  </button>
  ${S[c.openKey] ? `<div class="dp-popup" id="${c.wrapId}-popup">
    <div class="dp-cal">
      <div class="dp-hdr">
        <button class="dp-nav" onclick="event.stopPropagation();S.${c.dirKey}='prev';S.${c.vmKey}='${pMo}';render()">${CHEVL}</button>
        <span class="dp-hdr-lbl">${CAL_MN[vmn-1]} ${vy}</span>
        <button class="dp-nav" onclick="event.stopPropagation();S.${c.dirKey}='next';S.${c.vmKey}='${nMo}';render()">${CHEVR}</button>
      </div>
      <div class="dp-grid ${animClass}">
        ${CAL_WD.map(d=>`<div class="dp-wday">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  </div>` : ''}
</div>`;
}

/* ─── RANGE PICKER (weight page) ─────────────────────────────────────────── */
function pickRangeDate(date) {
  if (!S.wpick.from || S.wpick.to) { S.wpick.from = date; S.wpick.to = ''; }
  else                              { S.wpick.to   = date; }
  render();
}

function calSwipe(e) {
  const dx = e.changedTouches[0].clientX - (S.wpick._tx || 0);
  if (Math.abs(dx) < 40) return;
  const cym = td().slice(0,7);
  const vm  = S.wpick.viewMonth || (S.wpick.from ? S.wpick.from.slice(0,7) : cym);
  S.wpick.viewMonth = calMonthOffset(vm, dx < 0 ? 1 : -1);
  S.wpick._dir = dx < 0 ? 'next' : 'prev';
  render();
}

function renderRangePicker() {
  const todayStr = td();
  const cym = todayStr.slice(0,7);
  const vm  = S.wpick.viewMonth || (S.wpick.from ? S.wpick.from.slice(0,7) : cym);
  const [vy, vmn] = vm.split('-').map(Number);
  const pMo = calMonthOffset(vm, -1), nMo = calMonthOffset(vm, 1);
  const from = S.wpick.from, to = S.wpick.to;
  const lo = from&&to ? (from<to?from:to) : from;
  const hi = from&&to ? (from<to?to:from) : '';
  const animClass = S.wpick._dir === 'next' ? 'cal-next' : S.wpick._dir === 'prev' ? 'cal-prev' : '';
  S.wpick._dir = '';
  const cells = calBuildGrid(vy, vmn, todayStr, (d, date, isToday) => {
    const isLo = date===lo, isHi = date===hi;
    const inRng = lo&&hi && date>lo && date<hi;
    const cls = ['dp-day',
      isLo?'range-lo':'', isHi?'range-hi':'',
      (!isLo&&!isHi&&inRng)?'in-range':'',
      isToday?'today':''
    ].filter(Boolean).join(' ');
    return `<div class="dp-cell"><button class="${cls}" onclick="pickRangeDate('${date}')">${d}</button></div>`;
  });
  const status = !from ? 'Tap a start date'
    : !to ? `<span style="color:var(--blue)">${from}</span> &rarr; tap end date`
    :       `<span style="color:var(--blue)">${lo}</span> &rarr; <span style="color:var(--blue)">${hi}</span>`;
  return `<div style="margin:0 0 14px;width:100%" ontouchstart="S.wpick._tx=event.touches[0].clientX" ontouchend="calSwipe(event)">
  <div class="dp-cal" style="width:100%;box-sizing:border-box">
    <div class="dp-hdr">

/* ─── WEIGHT VIEW ─────────────────────────────────────────────────────────── */
function vW() {
  const all = sW();
  const f   = fW();                          // filtered entries — drives all tiles + chart
  const fullTrend = tL(all);                 // full EMA history (smoothing needs all past data)
  const cw  = lw();                          // current weight — always the latest log entry

  // trend weight: look up last filtered date in the full trend array
  const lastF = f.length ? f[f.length-1] : null;
  const trendLast = lastF ? fullTrend.find(t => t.date === lastF.date) : null;
  const tc = trendLast ? trendLast.tw.toFixed(1) : (lastF ? lastF.w.toFixed(1) : '--');

  // weekly rate: same algorithm as wr() but anchored to the last date in the filtered period
  let rate = null;
  if (f.length >= 2 && trendLast) {
    const cutoffMs = new Date(trendLast.date).getTime() - 7 * 864e5;
    const ref = fullTrend.filter(t => new Date(t.date).getTime() <= cutoffMs).pop();
    if (ref) {
      const days = (new Date(trendLast.date).getTime() - new Date(ref.date).getTime()) / 864e5;
      if (days > 0) rate = +((trendLast.tw - ref.tw) / days * 7).toFixed(2);
    }
  }

  const aW  = f.map(x => x.w);
  const avg  = aW.length ? (aW.reduce((a,b)=>a+b,0)/aW.length).toFixed(1) : '--';
  const minW = aW.length ? Math.min(...aW).toFixed(1) : '--';
  const maxW = aW.length ? Math.max(...aW).toFixed(1) : '--';
  const chg  = f.length >= 2 ? (f[f.length-1].w - f[0].w).toFixed(1) : '--';
  const startLbl = f.length ? f[0].date.slice(5) : '--';
  const wka  = weeklyAverages(f);

  return `
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
  <div>
    <div style="font-family:var(--fh);font-size:22px;font-weight:800;font-style:italic">Weight Tracker</div>
    <div style="font-size:12px;color:var(--text3)">Log every morning · trend weight smooths daily noise</div>
  </div>
</div>
<div class="g4">
  <div class="tile tb"><div class="tlbl">Current</div><div class="tval">${cw.toFixed(1)}<span class="tunit"> kg</span></div></div>
  <div class="tile tb"><div class="tlbl">Trend Weight</div><div class="tval cb">${tc}<span class="tunit"> kg</span></div><div class="tsub">Smoothed avg</div></div>
  <div class="tile ${chg!=='--'&&+chg<0?'tg':'tr'}"><div class="tlbl">Change</div><div class="tval ${chg!=='--'&&+chg<0?'cg':'cr'}">${chg==='--'?'--':((+chg<0?'▼ ':'▲ ')+Math.abs(+chg))}<span class="tunit"> kg</span></div><div class="tsub">since ${startLbl}</div></div>
  <div class="tile ${rate!==null&&rate<0?'tg':'ta'}">
    <div class="tlbl">Weekly Rate</div>
    <div class="tval ${rate!==null&&rate<0?'cg':'ca'}">${rate!==null?(rate<0?'▼ ':'▲ ')+Math.abs(rate).toFixed(2):'--'}<span style="font-size:11px;font-style:normal;color:var(--text3)"> kg/wk</span></div>
  </div>
</div>
<div class="card sg">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div class="clbl" style="margin-bottom:0">Daily Weight — Hover for reading</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="ttabs">
        <button class="ttab ${S.wtab==='week'?'on':''}"   onclick="S.wtab='week';render()">Week</button>
        <button class="ttab ${S.wtab==='month'?'on':''}"  onclick="S.wtab='month';render()">Month</button>
        <button class="ttab ${S.wtab==='all'?'on':''}"    onclick="S.wtab='all';render()">All</button>
        <button class="ttab ${S.wtab==='custom'?'on':''}" onclick="S.wtab='custom';S.wpick={from:S.wfrom,to:S.wto,viewMonth:''};S.wpickOpen=true;render()">Custom</button>
      </div>
      ${S.wtab==='month'?`<input type="month" value="${S.wmonth||(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')})()}" onchange="S.wmonth=this.value;render()" style="width:130px;font-size:12px" title="View a different month"/>`:''}
    </div>
  </div>
  ${S.wtab==='custom' ? (S.wpickOpen ? renderRangePicker() : `<div style="display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap">
    ${S.wfrom&&S.wto ? `<span style="font-size:12px;color:var(--text2)">${S.wfrom} &rarr; ${S.wto}</span>` : `<span style="font-size:12px;color:var(--text3)">No range set</span>`}
    <button onclick="S.wpickOpen=true;render()" style="background:none;border:1px solid var(--border2);border-radius:6px;color:var(--text2);cursor:pointer;font-size:11px;padding:3px 10px;touch-action:manipulation">Edit</button>
  </div>`) : ''}
  <div style="height:260px"><canvas id="ch-w"></canvas></div>
  <div class="lgnd" style="margin-top:10px">
    <div class="li"><div class="ld" style="background:#0066FF"></div>Daily weight</div>
    <div class="li"><div class="ld" style="background:#F59E0B"></div>Target −0.5kg/wk</div>
    <div class="li"><div class="ld" style="background:#22C55E;opacity:.8"></div>88kg goal</div>
  </div>
</div>
<div class="g4">
  <div class="tile"><div class="tlbl">Average</div><div class="tval">${avg}<span class="tunit"> kg</span></div><div class="tsub">${f.length} entries</div></div>
  <div class="tile tg"><div class="tlbl">Minimum</div><div class="tval cg">${minW}<span class="tunit"> kg</span></div></div>
  <div class="tile tr"><div class="tlbl">Maximum</div><div class="tval cr">${maxW}<span class="tunit"> kg</span></div></div>
  <div class="tile ta"><div class="tlbl">To Goal</div><div class="tval ca">${Math.max(0,cw-GOAL).toFixed(1)}<span class="tunit"> kg</span></div><div class="tsub">${eta()}</div></div>
</div>
<div class="g2">
  <div class="card">
    <div class="clbl">Log Weight</div>
    <div class="fr fr2">
      <div><label class="fl">Date</label>${renderDatePicker(S.wdDate,{dateExpr:'S.wdDate',openKey:'wdOpen',vmKey:'wdViewMonth',dirKey:'wdDir',wrapId:'wd-wrap'})}</div>
      <div><label class="fl">Weight (kg)</label><input type="text" inputmode="decimal" id="wv" placeholder="e.g. 96.8"/></div>
    </div>
    <button class="btn bb bfw" onclick="logW()" style="margin-bottom:14px">Log Weight</button>
    <div style="padding:13px;background:var(--bg3);border-radius:var(--rs);font-size:12px;color:var(--text3);line-height:1.9;border:1px solid var(--border)">
      <div style="font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px">Weigh-In Protocol</div>
      Every morning, same time · After bathroom, before eating · Same clothes or none · Trust the trend, not single spikes
    </div>
    ${wka.length ? `
    <div class="divl"></div>
    <div class="clbl">Weekly Averages</div>
    ${wka.map(w=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:12px;color:var(--text2)">Week of ${w.lbl}</span>
        <div class="fx">
          <span style="font-size:11px;color:var(--text3)">${w.n} entries</span>
          <span style="font-family:var(--fh);font-size:16px;font-weight:800">${w.avg} kg</span>
        </div>
      </div>`).join('')}` : ''}
  </div>
  <div class="card">
    <div class="clbl">History — ${f.length} entries</div>
    <div style="max-height:500px;overflow-y:auto">
      ${f.length===0 ? '<div class="empty">No entries yet</div>'
        : [...f].reverse().map((e,i,arr) => {
            const prev = arr[i+1];
            const delta = prev ? (e.w - prev.w).toFixed(1) : null;
            const tO = fullTrend.find(t => t.date===e.date);
            return `<div class="wrow">
              <div>
                <div class="wdate">${e.date.slice(5)}</div>
                ${tO?`<div class="wtw">trend ${tO.tw.toFixed(1)}kg</div>`:''}
              </div>
              <div class="fx">
                ${delta!==null?`<span class="wd2 ${+delta<0?'dn':'up'}">${+delta<0?'▼':'▲'}${Math.abs(+delta)}</span>`:''}
                <span class="wval2">${e.w.toFixed(1)}kg</span>
                <button class="delbtn" onclick="delW('${e.date}')" title="Delete entry">${TRASH_SVG}</button>
              </div>
            </div>`;
          }).join('')}
    </div>
  </div>
</div>`;
}

/* ─── ACTIONS ─────────────────────────────────────────────────────────────── */
function tc2(id) { S.openCards[id] = !S.openCards[id]; render(); }

function toggleNCard(id) {
  S.openCards['n_'+id] = !S.openCards['n_'+id];
  const isO = S.openCards['n_'+id];
  const card = document.querySelector('[data-id="' + id + '"]');
  if (!card) { render(); return; }
  const body = card.querySelector('.meal-card-body');
  const chevron = card.querySelector('.chevron');
  if (body) {
    body.innerHTML = isO ? ingEditor(id) : '';
    body.classList.toggle('open', isO);
  }
  if (chevron) chevron.style.transform = isO ? 'rotate(180deg)' : 'rotate(0deg)';
}

function toggleDashMeal(i) {
  const body = document.getElementById('dm-body-'+i);
  const chev = document.getElementById('dm-chev-'+i);
  if (!body) return;
  const open = body.style.display === 'block';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
}

function toggleLogCard(i) {
  const wasOpen = !!S.openCards['log_'+i];
  S.openCards['log_'+i] = !S.openCards['log_'+i];
  const isO = S.openCards['log_'+i];
  if (wasOpen && !isO) {
    const edId = 'logged_'+i;
    if (S._logEditorIngs) delete S._logEditorIngs[edId];
    if (S._logAddedIngs)  delete S._logAddedIngs[edId];
    if (S._logAllIngs)    delete S._logAllIngs[edId];
    if (S._logMacroBase)  delete S._logMacroBase[edId];
  }
  const m = (S.meals[S.mdate]||[])[i];
  const container = document.getElementById('log-entry-'+i);
  if (!container || !m) { render(); return; }
  const body = container.querySelector('.log-entry-body');
  const chevron = container.querySelector('.log-chevron');
  if (body) body.innerHTML = isO ? loggedItemEditor(m, i) : '';
  if (chevron) chevron.style.transform = isO ? 'rotate(180deg)' : 'rotate(0deg)';
}

function loggedItemEditor(m, idx) {
  const libLookup = m._libId || m.name;
  const custom = S.custom.find(c => c.name === libLookup || c.id === libLookup || c._id === libLookup);
  /* Prefer stored _ings — post-edit state takes priority over library definition */
  if (m._ings && m._ings.length) {
    return loggedItemEditorWithIngs(m, idx, m._ings, custom ? custom.note : undefined);
  }
  /* Fall back to library ingredient structure for entries not yet edited */
  if (custom && custom.ingredients && custom.ingredients.length) {
    const baseIngs = custom.ingredients.map(i => ({...i, qty: String(parseFloat(i.qty)||100)}));
    return loggedItemEditorWithIngs(m, idx, baseIngs, custom.note);
  }
  return loggedItemMacroEditor(m, idx);
}

function loggedItemEditorWithIngs(m, idx, baseIngs, note) {
  const edId = 'logged_'+idx;
  S._logEditorIngs = S._logEditorIngs || {};
  if (!S._logEditorIngs[edId]) S._logEditorIngs[edId] = baseIngs;
  const curBase = S._logEditorIngs[edId];
  S._logAddedIngs = S._logAddedIngs || {};
  if (!S._logAddedIngs[edId]) S._logAddedIngs[edId] = [];
  const allIngs = [...curBase, ...S._logAddedIngs[edId]];
  S._logAllIngs = S._logAllIngs || {};
  S._logAllIngs[edId] = allIngs;
  const ings = calcIng(edId, allIngs);
  const t = sumIngs(ings);
  return `<div style="background:var(--bg4);border-radius:var(--rs);padding:12px;margin-bottom:10px">
    ${note ? `<div class="meal-note-strip" style="margin-top:0;margin-bottom:8px">${note}</div>` : ''}
    <table class="ing-editor" style="margin-top:0">
      <thead><tr><th>Ingredient</th><th>g</th><th>Kcal</th><th style="color:var(--protein)">P</th><th style="color:var(--carbs)">C</th><th style="color:var(--fats)">F</th><th></th></tr></thead>
      <tbody>${allIngs.map((ing,i) => `<tr${i>=curBase.length?' style="background:var(--bg3)"':''}>
        <td><div class="ing-name" style="font-size:11px">${ing.name}${i>=curBase.length?' <span style="font-size:9px;color:var(--blue);font-weight:700">NEW</span>':''}</div></td>
        <td><input class="gram-inp" id="gi-${edId}-${i}" type="number" min="0" step="${isNaN(+ing.qty)||!Number.isInteger(+ing.qty)?'0.5':'5'}" value="${ings[i].g}" oninput="updateGCustom('${edId}',${i},this.value,S._logAllIngs['${edId}'])"/></td>
        <td><span class="im-cell" id="imc-${edId}-${i}-k">${ings[i].kcal}</span></td>
        <td><span class="im-cell" style="color:var(--protein)" id="imc-${edId}-${i}-p">${Math.round(ings[i].pro)}g</span></td>
        <td><span class="im-cell" style="color:var(--carbs)" id="imc-${edId}-${i}-c">${Math.round(ings[i].carb)}g</span></td>
        <td><span class="im-cell" style="color:var(--fats)" id="imc-${edId}-${i}-f">${Math.round(ings[i].fat)}g</span></td>
        <td><button class="ql-del" style="color:var(--red);border-color:var(--red);opacity:.7" onclick="logRemoveIng(${idx},${i})" title="Remove">${TRASH_SVG}</button></td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="live-tot" style="margin-top:8px">
      <span class="lt-lbl">New total</span>
      <div class="lt-nums">
        <span class="ltn2" id="itot-${edId}-k">${t.kcal} kcal</span>
        <span class="ltn2" style="color:var(--protein)" id="itot-${edId}-p">${Math.round(t.pro)}g P</span>
        <span class="ltn2" style="color:var(--carbs)" id="itot-${edId}-c">${Math.round(t.carb)}g C</span>
        <span class="ltn2" style="color:var(--fats)" id="itot-${edId}-f">${Math.round(t.fat)}g F</span>
      </div>
    </div>
    ${logAddSearchWidget(edId)}
    <div style="display:flex;gap:8px;margin-top:10px;justify-content:space-between">
      <button class="rst-btn" onclick="resetGCustom('${edId}',S._logAllIngs['${edId}'])">↺ Reset</button>
      <button class="log-custom" onclick="updateLoggedEntry(${idx},'${edId}',S._logEditorIngs['${edId}'])">✓ Update Log</button>
    </div>
  </div>`;
}

function loggedItemMacroEditor(m, idx) {
  const edId = 'logged_'+idx;
  S._logAddedIngs = S._logAddedIngs || {};
  if (!S._logAddedIngs[edId]) S._logAddedIngs[edId] = [];
  S._logMacroBase = S._logMacroBase || {};
  S._logMacroBase[edId] = {kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat};
  const addedIngs = S._logAddedIngs[edId];

  if (addedIngs.length) {
    S._logAllIngs = S._logAllIngs || {};
    S._logAllIngs[edId] = addedIngs;
    const ings = calcIng(edId, addedIngs);
    const addedTot = sumIngs(ings);
    const combKcal = Math.round(m.kcal + addedTot.kcal);
    const combPro  = +(m.pro  + addedTot.pro ).toFixed(1);
    const combCarb = +(m.carb + addedTot.carb).toFixed(1);
    const combFat  = +(m.fat  + addedTot.fat ).toFixed(1);
    return `<div style="background:var(--bg4);border-radius:var(--rs);padding:12px;margin-bottom:10px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px">Original: ${m.kcal} kcal · ${m.pro}g P · ${m.carb}g C · ${m.fat}g F</div>
      <table class="ing-editor" style="margin-top:0">
        <thead><tr><th>Added item</th><th>g</th><th>Kcal</th><th style="color:var(--protein)">P</th><th style="color:var(--carbs)">C</th><th style="color:var(--fats)">F</th><th></th></tr></thead>
        <tbody>${addedIngs.map((ing,i) => `<tr>
          <td><div class="ing-name" style="font-size:11px">${ing.name}</div></td>
          <td><input class="gram-inp" id="gi-${edId}-${i}" type="number" min="0" step="5" value="${ings[i].g}" oninput="updateLogAddedLive('${edId}')"/></td>
          <td><span class="im-cell" id="imc-${edId}-${i}-k">${ings[i].kcal}</span></td>

async function updateLoggedEntry(idx, edId, baseIngs) {
  const addedIngs = (S._logAddedIngs && S._logAddedIngs[edId]) || [];
  const allIngs = S._logAllIngs && S._logAllIngs[edId] ? S._logAllIngs[edId] : [...baseIngs, ...addedIngs];
  allIngs.forEach((ing, i) => {
    const el = document.getElementById('gi-'+edId+'-'+i);
    if (el) S.gO[edId+'_'+i] = parseFloat(el.value) || 0;
  });
  const ings = calcIng(edId, allIngs);
  const t = sumIngs(ings);
  const meal = S.meals[S.mdate][idx];
  if (!meal) return;
  const cloudId = meal._id;
  meal.kcal = t.kcal; meal.pro = t.pro; meal.carb = t.carb; meal.fat = t.fat;
  meal._ings = allIngs.map((ing, i) => ({
    name: ing.name,
    qty:  String(S.gO[edId+'_'+i] !== undefined ? S.gO[edId+'_'+i] : parseFloat(ing.qty)||0),
    kcal: ings[i].kcal, pro: ings[i].pro, carb: ings[i].carb, fat: ings[i].fat
  }));
  LS.set('sc_m', S.meals);
  allIngs.forEach((_,i) => delete S.gO[edId+'_'+i]);
  if (S._logEditorIngs) delete S._logEditorIngs[edId];
  if (S._logAddedIngs)  delete S._logAddedIngs[edId];
  if (S._logAllIngs)    delete S._logAllIngs[edId];
  S.openCards['log_'+idx] = false;
  render();
  if (sb && cloudId) {
    syncStatus('syncing', 'Saving...');
    const {error} = await sb.from('meal_logs').update({
      kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat,
      ings_json: JSON.stringify(meal._ings)
    }).eq('id', cloudId);
    syncStatus(error ? 'error' : 'synced', error ? 'Save failed' : 'Saved');
  }
}

        style="font-size:12px"

function logAddSearch(edId, q) {
  const dd = document.getElementById('la-dd-'+edId); if (!dd) return;
  if (!q || q.trim().length < 1) { dd.innerHTML = ''; return; }
  const results = searchFoodDB(q);
  if (!results.length) {
    dd.innerHTML = `<div class="ql-result" style="cursor:default"><span style="color:var(--text3);font-size:12px">No ingredients found for "${q}"</span></div>`;
    return;
  }
  dd.innerHTML = results.map(f => {
    const mv = isGramUnit(f) ? f.per100 : f.perUnit;
    const perLabel = isGramUnit(f) ? `per 100${f.unit}` : `per ${f.unitLabel||f.unit}`;
    const isOil = !!FLAGGED_FOODS[f.name];
    return `<div class="ql-result" onmousedown="event.preventDefault();logAddFood('${edId}',${JSON.stringify(f).replace(/"/g,'&quot;')})">
      <div>
        <div class="ql-result-name${isOil?' oil-warn':''}">${f.name}${isOil?' ⚠️':''}</div>
        <div class="ql-result-cat">${f.cat} · ${perLabel}</div>
      </div>
      <div class="ql-result-macros">
        <div>${mv.kcal}kcal</div><div><span style="color:var(--protein)">${mv.pro}g P</span> · ${mv.carb}g C · ${mv.fat}g F</div>
      </div>
    </div>`;
  }).join('');
}

function logAddFood(edId, food) {
  S._logAddedIngs = S._logAddedIngs || {};
  if (!S._logAddedIngs[edId]) S._logAddedIngs[edId] = [];
  const qty = food.defaultQty || (isGramUnit(food) ? 100 : 1);
  const macros = foodMacros(food, qty);
  S._logAddedIngs[edId].push({name: food.name, qty: String(qty), kcal: macros.kcal, pro: macros.pro, carb: macros.carb, fat: macros.fat});
  const dd = document.getElementById('la-dd-'+edId); if (dd) dd.innerHTML = '';
  const si = document.getElementById('la-si-'+edId); if (si) si.value = '';
  const idx = parseInt(edId.replace('logged_',''), 10);
  refreshLogEditor(idx);
}

function logAddClose(edId) {
  const dd = document.getElementById('la-dd-'+edId); if (dd) dd.innerHTML = '';
}

function logRemoveIng(logIdx, ingIdx) {
  const edId = 'logged_' + logIdx;
  S._logEditorIngs = S._logEditorIngs || {};
  S._logAddedIngs  = S._logAddedIngs  || {};
  const baseIngs  = S._logEditorIngs[edId] || [];
  const addedIngs = S._logAddedIngs[edId]  || [];
  const total = baseIngs.length + addedIngs.length;
  /* Shift S.gO entries down so indices stay aligned after the splice */
  for (let j = ingIdx; j < total - 1; j++) {
    const v = S.gO[edId + '_' + (j + 1)];
    if (v !== undefined) S.gO[edId + '_' + j] = v;
    else delete S.gO[edId + '_' + j];
  }
  delete S.gO[edId + '_' + (total - 1)];
  const allIngs = [...baseIngs, ...addedIngs];
  allIngs.splice(ingIdx, 1);
  const newBase = ingIdx < baseIngs.length ? baseIngs.length - 1 : baseIngs.length;
  S._logEditorIngs[edId] = allIngs.slice(0, newBase);
  S._logAddedIngs[edId]  = allIngs.slice(newBase);
  refreshLogEditor(logIdx);
}

function refreshLogEditor(idx) {
  const m = (S.meals[S.mdate]||[])[idx];
  const container = document.getElementById('log-entry-'+idx);
  if (!container || !m || !S.openCards['log_'+idx]) return;
  const body = container.querySelector('.log-entry-body');
  if (body) body.innerHTML = loggedItemEditor(m, idx);
}

const _debouncedLogAddUpdate = debounce((edId) => {
  S._logAddedIngs = S._logAddedIngs || {};
  const addedIngs = S._logAddedIngs[edId] || [];
  if (!addedIngs.length) return;
  addedIngs.forEach((ing, i) => {
    const el = document.getElementById('gi-'+edId+'-'+i);
    if (el) S.gO[edId+'_'+i] = parseFloat(el.value) || 0;
  });
  const calced = calcIng(edId, addedIngs);
  calced.forEach((ing, j) => {
    const sv = (sfx, v) => { const e = document.getElementById(`imc-${edId}-${j}-${sfx}`); if(e) e.textContent = v; };
    sv('k', ing.kcal); sv('p', Math.round(ing.pro)+'g'); sv('c', Math.round(ing.carb)+'g'); sv('f', Math.round(ing.fat)+'g');
  });
  const addedTot = sumIngs(calced);
  const base = S._logMacroBase && S._logMacroBase[edId];
  const cK = Math.round((base ? base.kcal : 0) + addedTot.kcal);
  const cP = +((base ? base.pro  : 0) + addedTot.pro ).toFixed(1);
  const cC = +((base ? base.carb : 0) + addedTot.carb).toFixed(1);
  const cF = +((base ? base.fat  : 0) + addedTot.fat ).toFixed(1);
  const st = (sfx, v) => { const e = document.getElementById(`itot-${edId}-${sfx}`); if(e) e.textContent = v; };
  st('k', cK+' kcal'); st('p', Math.round(cP)+'g P'); st('c', Math.round(cC)+'g C'); st('f', Math.round(cF)+'g F');
}, 300);

async function updateLoggedMacroEntry(idx) {
  const edId = 'logged_'+idx;
  const addedIngs = (S._logAddedIngs && S._logAddedIngs[edId]) || [];
  const meal = S.meals[S.mdate][idx]; if (!meal) return;
  const cloudId = meal._id;
  let kcal, pro, carb, fat, newIngs = null;

  if (addedIngs.length) {
    addedIngs.forEach((ing, i) => {
      const el = document.getElementById('gi-'+edId+'-'+i);
      if (el) S.gO[edId+'_'+i] = parseFloat(el.value) || 0;
    });
    const calced = calcIng(edId, addedIngs);
    const addedTot = sumIngs(calced);
    const base = S._logMacroBase && S._logMacroBase[edId];
    kcal = Math.round((base ? base.kcal : meal.kcal) + addedTot.kcal);
    pro  = +((base ? base.pro  : meal.pro)  + addedTot.pro ).toFixed(1);
    carb = +((base ? base.carb : meal.carb) + addedTot.carb).toFixed(1);
    fat  = +((base ? base.fat  : meal.fat)  + addedTot.fat ).toFixed(1);
    newIngs = addedIngs.map((ing, i) => ({
      name: ing.name,
      qty:  String(S.gO[edId+'_'+i] !== undefined ? S.gO[edId+'_'+i] : parseFloat(ing.qty)||0),
      kcal: calced[i].kcal, pro: calced[i].pro, carb: calced[i].carb, fat: calced[i].fat
    }));
    addedIngs.forEach((_,i) => delete S.gO[edId+'_'+i]);
    if (S._logAddedIngs) delete S._logAddedIngs[edId];
    if (S._logMacroBase) delete S._logMacroBase[edId];
  } else {
    kcal = Math.round(parseFloat(document.getElementById('le-k-'+idx)?.value)||0);
    pro  = +(parseFloat(document.getElementById('le-p-'+idx)?.value)||0).toFixed(1);
    carb = +(parseFloat(document.getElementById('le-c-'+idx)?.value)||0).toFixed(1);
    fat  = +(parseFloat(document.getElementById('le-f-'+idx)?.value)||0).toFixed(1);
  }

  meal.kcal = kcal; meal.pro = pro; meal.carb = carb; meal.fat = fat;
  if (newIngs) meal._ings = newIngs;
  LS.set('sc_m', S.meals);
  S.openCards['log_'+idx] = false;
  render();
  if (sb && cloudId) {
    syncStatus('syncing', 'Saving...');
    const upd = {kcal, pro, carb, fat};
    if (newIngs) upd.ings_json = JSON.stringify(newIngs);
    const {error} = await sb.from('meal_logs').update(upd).eq('id', cloudId);
    syncStatus(error ? 'error' : 'synced', error ? 'Save failed' : 'Saved');
  }
}

async function qadd(id) {
  const m = am().find(x => x.name === id); if(!m) return;
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  /* Always use meal name as _libId — name is the reliable lookup key.
     UUIDs change if a meal is deleted and recreated; names don't. */
  const baseIngs = m.ingredients && m.ingredients.length
    ? m.ingredients.map(ing => ({...ing, qty: String(parseFloat(ing.qty)||100)}))
    : null;
  const meal = {
    name: m.name, kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
    time: now(), _libId: m.name,
    _ings: baseIngs ? baseIngs.map(ing => ({
      name: ing.name, qty: ing.qty,
      kcal: ing.kcal, pro: ing.pro, carb: ing.carb, fat: ing.fat
    })) : null
  };
  const mealIdx = S.meals[S.mdate].length;
  S.meals[S.mdate].push(meal);
  LS.set('sc_m', S.meals);
  render();
  const cloudId = await cloudAddMeal(S.mdate, meal);
  if (cloudId && S.meals[S.mdate][mealIdx]) {
    S.meals[S.mdate][mealIdx]._id = cloudId;
    LS.set('sc_m', S.meals);
  }
}

/* ─── CHARTS ──────────────────────────────────────────────────────────────── */
function ic() { if(S.view==='dashboard') dC(); if(S.view==='weight') wC(); }

function bDS(data) {
  if (!data.length) return {labels:[],datasets:[]};
  const first=data[0].w, fd2=new Date(data[0].date);
  const tgt = data.map(x => +(first - RATET * Math.round((new Date(x.date)-fd2)/864e5)).toFixed(2));
  const ptC = data.map((x,i) => i===0?'#0066FF': x.w<data[i-1].w?'#22C55E': x.w>data[i-1].w?'#FF3B30':'#0066FF');
  return {
    labels: data.map(x=>x.date.slice(5)),
    datasets:[
      {label:'Daily weight', data:data.map(x=>x.w), borderColor:'#0066FF', borderWidth:1.8, pointRadius:3, pointHoverRadius:6, pointBackgroundColor:ptC, pointBorderColor:ptC, pointHoverBackgroundColor:ptC, tension:.25, fill:true, backgroundColor:'#0066FF0A'},
      {label:'Target',       data:tgt,                borderColor:'#F59E0B', borderWidth:1.5, borderDash:[5,4], pointRadius:0, pointHoverRadius:0, tension:.3,   fill:false},
      {label:'Goal',         data:data.map(()=>GOAL), borderColor:'#22C55E', borderWidth:1,   borderDash:[3,6], pointRadius:0, pointHoverRadius:0, tension:0,    fill:false},
    ]
  };
}

function mO(aw) {
  return {...CG, scales:{...CG.scales, y:{...CG.scales.y, min:Math.min(GOAL-1,...aw)-0.5, max:Math.max(...aw)+0.5}}};
}
function dC() {
  const el=document.getElementById('ch-d'); if(!el) return;
  const s=sW(); if(!s.length) return;
  if(CH['d']){try{CH['d'].destroy();}catch(e){}}
  S.dashView.range  = Math.max(7, Math.min(S.dashView.range, s.length));
  S.dashView.offset = Math.max(0, Math.min(S.dashView.offset, s.length - S.dashView.range));
  const end=s.length-S.dashView.offset, start=Math.max(0,end-S.dashView.range);
  const vis=s.slice(start,end);
  const {labels,datasets}=bDS(vis);
  /* Scale Y to the FULL weight history (s), not just the visible window, so the
     Dashboard Y-axis matches the Weight page chart (which scales to fW() = all). */
  CH['d']=new Chart(el,{type:'line',data:{labels,datasets},options:mO(s.map(x=>x.w))});
  initDashChartTouch(el,s);
}

function updateDashChart() {
  const chart=CH['d']; if(!chart) return;
  const s=sW(); if(!s.length) return;
  S.dashView.range  = Math.max(7, Math.min(S.dashView.range, s.length));
  S.dashView.offset = Math.max(0, Math.min(S.dashView.offset, s.length - S.dashView.range));
  const end=s.length-S.dashView.offset, start=Math.max(0,end-S.dashView.range);
  const vis=s.slice(start,end);
  if(!vis.length) return;
  const {labels,datasets}=bDS(vis);
  chart.data.labels=labels;
  chart.data.datasets.forEach((ds,i)=>{ if(datasets[i]) ds.data=datasets[i].data; });
  const aw=s.map(x=>x.w); // full history → stable Y that matches the Weight page chart
  chart.options.scales.y.min=Math.min(GOAL-1,...aw)-0.5;
  chart.options.scales.y.max=Math.max(...aw)+0.5;
  chart.update('none');
}

function initDashChartTouch(el, s) {
  let t0=null, startOffset=0, startRange=0, startDist=0, isPinch=false;
  el.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(e.touches.length===1){
      isPinch=false;
      t0={x:e.touches[0].clientX};
      startOffset=S.dashView.offset;
    } else if(e.touches.length===2){
      isPinch=true; t0=null;
      startDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      startRange=S.dashView.range;
      startOffset=S.dashView.offset;
    }
  },{passive:false});

  el.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(!s.length) return;
    if(e.touches.length===1 && !isPinch && t0){
      const dx=e.touches[0].clientX-t0.x;
      const ppe=el.offsetWidth/S.dashView.range;
      const delta=Math.round(dx/ppe);
      const maxOff=Math.max(0,s.length-S.dashView.range);
      const newOff=Math.max(0,Math.min(maxOff,startOffset+delta));
      if(newOff!==S.dashView.offset){S.dashView.offset=newOff; updateDashChart();}
    } else if(e.touches.length===2 && isPinch){
      const dist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      const newRange=Math.max(7,Math.min(s.length,Math.round(startRange*(startDist/dist))));
      if(newRange!==S.dashView.range){S.dashView.range=newRange; updateDashChart();}
    }
  },{passive:false});

  el.addEventListener('touchend', e=>{
    if(e.touches.length===0){t0=null; isPinch=false;}
    else if(e.touches.length===1 && isPinch){
      isPinch=false;
      t0={x:e.touches[0].clientX};
      startOffset=S.dashView.offset;
    }
  },{passive:true});
}
